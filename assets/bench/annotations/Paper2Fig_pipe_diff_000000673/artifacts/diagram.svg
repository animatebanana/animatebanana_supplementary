<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Arrowhead definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3b75af" />
    </marker>

    <!-- Gradients for DSIFT and MKL SVM nodes -->
    <linearGradient id="dsift_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcccc" />
      <stop offset="100%" stop-color="#ff9999" />
    </linearGradient>

    <linearGradient id="mkl_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2f0d9" />
      <stop offset="100%" stop-color="#d0e7b8" />
    </linearGradient>
  </defs>

  <!-- EDGES -->
  <g>
    <path id="edge_1" data-id="edge_1" data-class="edge" data-source="node_original_image" data-target="node_T" d="M 191 166 L 218 166" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path id="edge_2" data-id="edge_2" data-class="edge" data-source="node_saliency_map" data-target="node_T" d="M 223 258 L 233 184" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path id="edge_3" data-id="edge_3" data-class="edge" data-source="node_T" data-target="node_salient_image" d="M 248 153 L 303 73" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path id="edge_4" data-id="edge_4" data-class="edge" data-source="node_T" data-target="node_nonsalient_image" d="M 248 179 L 303 260" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path id="edge_5" data-id="edge_5" data-class="edge" data-source="node_salient_image" data-target="node_dsift_top" d="M 493 70 L 513 70" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path id="edge_6" data-id="edge_6" data-class="edge" data-source="node_nonsalient_image" data-target="node_dsift_bottom" d="M 493 260 L 513 260" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path id="edge_7" data-id="edge_7" data-class="edge" data-source="node_dsift_top" data-target="composite_spm_top" d="M 610 70 L 631 70" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path id="edge_8" data-id="edge_8" data-class="edge" data-source="node_dsift_bottom" data-target="composite_spm_bottom" d="M 610 260 L 631 260" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path id="edge_9" data-id="edge_9" data-class="edge" data-source="composite_spm_top" data-target="node_mkl_svm" d="M 818 70 L 870 145" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path id="edge_10" data-id="edge_10" data-class="edge" data-source="composite_spm_bottom" data-target="node_mkl_svm" d="M 818 260 L 870 185" stroke="#3b75af" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  </g>

  <!-- NODES & BLOCKS -->

  <!-- 1. Original Image Node -->
  <g id="node_original_image" data-id="node_original_image" data-class="raster_node"><image href="../rasters/crop_node_original_image.png" xlink:href="../rasters/crop_node_original_image.png" x="3" y="98" width="188" height="135" preserveAspectRatio="xMidYMid meet" /></g>
  <text id="text_original_image" data-id="text_original_image" data-class="text_node" data-parent="root" x="97" y="253" font-family="serif" font-size="22" fill="#000000" text-anchor="middle">Original Image</text>

  <!-- 2. Saliency Map Node -->
  <g id="node_saliency_map" data-id="node_saliency_map" data-class="raster_node"><image href="../rasters/crop_node_saliency_map.png" xlink:href="../rasters/crop_node_saliency_map.png" x="173" y="258" width="100" height="71" preserveAspectRatio="xMidYMid meet" /></g>
  <text id="text_saliency_map" data-id="text_saliency_map" data-class="text_node" data-parent="root" x="223" y="348" font-family="serif" font-size="22" fill="#000000" text-anchor="middle">Saliency</text>

  <!-- 3. Transformation Node "T" -->
  <g id="node_T" data-id="node_T" data-class="standalone_node" data-parent="root">
