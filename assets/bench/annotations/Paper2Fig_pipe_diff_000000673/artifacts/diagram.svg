  <text id="text_salient_image" data-id="text_salient_image" data-class="text_node" data-parent="root" x="399" y="160" font-family="serif" font-size="22" fill="#000000" text-anchor="middle">Salient</text>

  <!-- 5. Non-salient Image Node -->
