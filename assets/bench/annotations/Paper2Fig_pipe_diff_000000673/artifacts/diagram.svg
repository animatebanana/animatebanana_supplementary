  <text id="text_spm_bottom" data-id="text_spm_bottom" data-class="text_node" data-parent="root" x="725" y="355" font-family="serif" font-size="22" fill="#000000" text-anchor="middle">SPM</text>

  <!-- 10. MKL SVM Node -->
  <g id="node_mkl_svm" data-id="node_mkl_svm" data-class="standalone_node" data-parent="root">
