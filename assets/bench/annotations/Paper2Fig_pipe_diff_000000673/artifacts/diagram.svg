    <text x="562.5" y="64" font-family="serif" font-size="20" fill="#000000" text-anchor="middle">DSIFT</text>
    <text x="562.5" y="88" font-family="serif" font-size="20" fill="#000000" text-anchor="middle">Features</text>
  </g>

