      M 767 70 h 5 v -41 h -5 z  M 775 70 h 5 v -30 h -5 z  M 783 70 h 5 v -18 h -5 z
      M 791 70 h 5 v -23 h -5 z  M 799 70 h 5 v -48 h -5 z" />
    <!-- Quadrant 3 Bars (Bottom-Left) -->
    <path id="spm_top_q3" data-id="spm_top_q3" data-class="composite_part" data-parent="composite_spm_top" fill="#8ea9db" d="
      M 650 135 h 5 v -52 h -5 z  M 658 135 h 5 v -38 h -5 z  M 666 135 h 5 v -25 h -5 z
      M 674 135 h 5 v -41 h -5 z  M 682 135 h 5 v -30 h -5 z  M 690 135 h 5 v -18 h -5 z
      M 698 135 h 5 v -23 h -5 z  M 706 135 h 5 v -48 h -5 z" />
    <!-- Quadrant 4 Bars (Bottom-Right) -->
    <path id="spm_top_q4" data-id="spm_top_q4" data-class="composite_part" data-parent="composite_spm_top" fill="#8ea9db" d="
      M 743 135 h 5 v -52 h -5 z  M 751 135 h 5 v -38 h -5 z  M 759 135 h 5 v -25 h -5 z
      M 767 135 h 5 v -41 h -5 z  M 775 135 h 5 v -30 h -5 z  M 783 135 h 5 v -18 h -5 z
      M 791 135 h 5 v -23 h -5 z  M 799 135 h 5 v -48 h -5 z" />
  </g>
