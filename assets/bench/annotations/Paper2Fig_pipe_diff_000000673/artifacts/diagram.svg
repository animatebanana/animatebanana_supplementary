      M 674 260 h 5 v -41 h -5 z  M 682 260 h 5 v -30 h -5 z  M 690 260 h 5 v -18 h -5 z
      M 698 260 h 5 v -23 h -5 z  M 706 260 h 5 v -48 h -5 z" />
    <!-- Quadrant 2 Bars (Top-Right) -->
    <path id="spm_bottom_q2" data-id="spm_bottom_q2" data-class="composite_part" data-parent="composite_spm_bottom" fill="#8ea9db" d="
      M 743 260 h 5 v -52 h -5 z  M 751 260 h 5 v -38 h -5 z  M 759 260 h 5 v -25 h -5 z
      M 767 260 h 5 v -41 h -5 z  M 775 260 h 5 v -30 h -5 z  M 783 260 h 5 v -18 h -5 z
      M 791 260 h 5 v -23 h -5 z  M 799 260 h 5 v -48 h -5 z" />
    <!-- Quadrant 3 Bars (Bottom-Left) -->
    <path id="spm_bottom_q3" data-id="spm_bottom_q3" data-class="composite_part" data-parent="composite_spm_bottom" fill="#8ea9db" d="
      M 650 325 h 5 v -52 h -5 z  M 658 325 h 5 v -38 h -5 z  M 666 325 h 5 v -25 h -5 z
      M 674 325 h 5 v -41 h -5 z  M 682 325 h 5 v -30 h -5 z  M 690 325 h 5 v -18 h -5 z
      M 698 325 h 5 v -23 h -5 z  M 706 325 h 5 v -48 h -5 z" />
    <!-- Quadrant 4 Bars (Bottom-Right) -->
    <path id="spm_bottom_q4" data-id="spm_bottom_q4" data-class="composite_part" data-parent="composite_spm_bottom" fill="#8ea9db" d="
      M 743 325 h 5 v -52 h -5 z  M 751 325 h 5 v -38 h -5 z  M 759 325 h 5 v -25 h -5 z
      M 767 325 h 5 v -41 h -5 z  M 775 325 h 5 v -30 h -5 z  M 783 325 h 5 v -18 h -5 z
      M 791 325 h 5 v -23 h -5 z  M 799 325 h 5 v -48 h -5 z" />
