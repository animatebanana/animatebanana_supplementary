    <line id="spm_bottom_line_h" data-id="spm_bottom_line_h" data-class="composite_part" data-parent="composite_spm_bottom" x1="633" y1="262.5" x2="818" y2="262.5" stroke="#70a0d0" stroke-width="1.5" />
    <!-- Quadrant 1 Bars (Top-Left) -->
    <path id="spm_bottom_q1" data-id="spm_bottom_q1" data-class="composite_part" data-parent="composite_spm_bottom" fill="#8ea9db" d="
