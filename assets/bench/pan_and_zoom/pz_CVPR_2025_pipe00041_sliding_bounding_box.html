<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <style>
      /* =========================================
         LAYER 1: CINEMATIC CAMERA RIG (PAN & ZOOM)
         Pacing: 52s total (25 distinct steps * 2.0s + 2s Final Zoom Out)
         Logic: Camera starts at global view, PANS (0.5s), ARRIVES. 
         Camera HOLDS for 1.5s of reading time.
         Safe Viewport: 960x400 (Top 400px, leaving 80px for the banner)
         Center: X=480, Y=200
         ========================================= */
      #camera_rig {
        transform-origin: 0 0;
        animation: cameraPan 52s ease-in-out infinite;
      }

      @keyframes cameraPan {
        /* 0s: Start Full View */
        0% { transform: translate(0px, 0px) scale(1); }
        
        /* TS1 (0s-2s): INPUT BLOCK */
        0.96%, 3.84% { transform: translate(360px, 57.5px) scale(1.0); }
        
        /* TS2 (2s-4s): 3D Point Cloud */
        4.81%, 7.69% { transform: translate(216px, -2.4px) scale(2.2); }
        
        /* TS3 (4s-6s): RGB Images */
        8.66%, 11.53% { transform: translate(317.5px, -263.75px) scale(2.5); }
        
        /* TS4 (6s-8s): Depth Images */
        12.50%, 15.38% { transform: translate(223.75px, -428.75px) scale(2.5); }
        
        /* TS5 (8s-10s): STEP 1 OVERVIEW (MACRO RESET) */
        16.35%, 19.23% { transform: translate(-120px, 65px) scale(1.0); }
        
        /* TS6 (10s-12s): Superpoint */
        20.19%, 23.07% { transform: translate(-295px, 12.5px) scale(2.5); }
        
        /* TS7 (12s-14s): Histogram */
        24.04%, 26.92% { transform: translate(-320px, -233.75px) scale(2.5); }
        
        /* TS8 (14s-16s): Pivot View */
        27.88%, 30.76% { transform: translate(-595px, -265px) scale(2.5); }
        
        /* TS9 (16s-18s): SAM 2 Segmentation */
        31.73%, 34.61% { transform: translate(-595px, -5px) scale(2.5); }
        
        /* TS10 (18s-20s): 2D Mask Pivot */
        35.58%, 38.46% { transform: translate(-907.5px, -40px) scale(2.5); }
        
        /* TS11 (20s-22s): SAM 2 Tracking */
        39.42%, 42.30% { transform: translate(-1220px, -5px) scale(2.5); }
        
        /* TS12 (22s-24s): 3D Cues */
        43.27%, 46.15% { transform: translate(-1220px, 93.75px) scale(2.5); }
        
        /* TS13 (24s-26s): Bidirectional Tracking */
        47.11%, 50.00% { transform: translate(-1310px, -15.25px) scale(2.1); }
        
        /* TS14 (26s-28s): 2D Mask Track */
        50.96%, 53.84% { transform: translate(-831px, -184.75px) scale(1.9); }
        
        /* TS15 (28s-30s): STEP 2 OVERVIEW (MACRO RESET) */
        54.81%, 57.69% { transform: translate(-120px, -172.5px) scale(1.0); }
        
        /* TS16 (30s-32s): Lifting */
        58.65%, 61.53% { transform: translate(-1720px, -718.75px) scale(2.5); }
        
        /* TS17 (32s-34s): Refining */
        62.50%, 65.38% { transform: translate(-1282.5px, -718.75px) scale(2.5); }
        
        /* TS18 (34s-36s): Final 3D Proposal */
        66.35%, 69.23% { transform: translate(-882.5px, -693.75px) scale(2.5); }
        
        /* TS19 (36s-38s): Class-Agnostic Segmentation */
        70.19%, 73.07% { transform: translate(-181.5px, -503.8px) scale(1.8); }
        
        /* TS20 (38s-40s): OUTPUT OVERVIEW (MACRO RESET) */
        74.04%, 76.92% { transform: translate(312px, -339px) scale(1.4); }
        
        /* TS21 (40s-42s): Open-Vocab */
        77.88%, 80.76% { transform: translate(180px, -643.75px) scale(2.5); }
        
        /* TS22 (42s-44s): Open-Ended */
        81.73%, 84.61% { transform: translate(180px, -731.25px) scale(2.5); }
        
        /* TS23 (44s-46s): CLIP */
        85.58%, 88.46% { transform: translate(292.5px, -825px) scale(2.5); }
        
        /* TS24 (46s-48s): LLM */
        89.42%, 92.30% { transform: translate(92.5px, -825px) scale(2.5); }
        
        /* TS25 (48s-50s): Labels */
        93.27%, 96.15% { transform: translate(180px, -930px) scale(2.5); }
        
        /* GRAND FINALE (50s-52s): Global Zoom Out & Hold */
        97.11%, 100% { transform: translate(0px, 0px) scale(1); }
      }

      /* =========================================
         LAYER 2: HOPPING BOUNDING BOX
         Logic: The box is invisible (opacity:0) during the 0.5s pan, 
         and POPS into existence (opacity:1) at the EXACT moment the camera arrives.
         ========================================= */
      #focus_box {
        animation: hop 52s step-end infinite;
      }

      @keyframes hop {
        /* TS1 */
        0%, 0.95% { opacity: 0; x: 1px; y: 1px; width: 238px; height: 283px; }
        0.96%, 3.84% { opacity: 1; x: 1px; y: 1px; width: 238px; height: 283px; }

        /* TS5 */

        /* TS6 */

        /* TS7 */

        /* TS8 */

        27.89%, 30.76% { opacity: 1; x: 386px; y: 141px; width: 88px; height: 90px; }
        /* TS9 */
        30.77%, 31.73% { opacity: 0; x: 376px; y: 58px; width: 108px; height: 48px; }
        31.74%, 34.61% { opacity: 1; x: 376px; y: 58px; width: 108px; height: 48px; }
        /* TS10 */
        34.62%, 35.57% { opacity: 0; x: 511px; y: 51px; width: 88px; height: 90px; }
        35.58%, 38.46% { opacity: 1; x: 511px; y: 51px; width: 88px; height: 90px; }
        /* TS11 */
        38.47%, 39.42% { opacity: 0; x: 626px; y: 58px; width: 108px; height: 48px; }
        39.43%, 42.30% { opacity: 1; x: 626px; y: 58px; width: 108px; height: 48px; }
        /* TS12 */
        42.31%, 43.26% { opacity: 0; x: 653px; y: 31px; width: 54px; height: 23px; }
        43.27%, 46.15% { opacity: 1; x: 653px; y: 31px; width: 54px; height: 23px; }
        /* TS13 */
        46.16%, 47.11% { opacity: 0; x: 756px; y: 41px; width: 193px; height: 123px; }
        47.12%, 50.00% { opacity: 1; x: 756px; y: 41px; width: 193px; height: 123px; }
        /* TS14 */
        50.01%, 50.96% { opacity: 0; x: 526px; y: 171px; width: 328px; height: 63px; }
        50.97%, 53.84% { opacity: 1; x: 526px; y: 171px; width: 328px; height: 63px; }
        /* TS15 */
        53.85%, 54.80% { opacity: 0; x: 241px; y: 266px; width: 718px; height: 213px; }
        54.81%, 57.69% { opacity: 1; x: 241px; y: 266px; width: 718px; height: 213px; }
        /* TS16 */
        57.70%, 58.65% { opacity: 0; x: 811px; y: 331px; width: 138px; height: 73px; }
        58.66%, 61.53% { opacity: 1; x: 811px; y: 331px; width: 138px; height: 73px; }
        /* TS17 */
        61.54%, 62.50% { opacity: 0; x: 611px; y: 331px; width: 188px; height: 73px; }
        62.51%, 65.38% { opacity: 1; x: 611px; y: 331px; width: 188px; height: 73px; }
        /* TS18 */
        65.39%, 66.34% { opacity: 0; x: 491px; y: 311px; width: 108px; height: 93px; }
        66.35%, 69.23% { opacity: 1; x: 491px; y: 311px; width: 108px; height: 93px; }
        /* TS19 */
        69.24%, 70.19% { opacity: 0; x: 256px; y: 316px; width: 223px; height: 150px; }
        70.20%, 73.07% { opacity: 1; x: 256px; y: 316px; width: 223px; height: 150px; }
        /* TS20 */
        73.08%, 74.03% { opacity: 0; x: 1px; y: 291px; width: 238px; height: 188px; }
        74.04%, 76.92% { opacity: 1; x: 1px; y: 291px; width: 238px; height: 188px; }
        /* TS21 */
        76.93%, 77.88% { opacity: 0; x: 11px; y: 321px; width: 218px; height: 33px; }
        77.89%, 80.76% { opacity: 1; x: 11px; y: 321px; width: 218px; height: 33px; }
        /* TS22 */
        80.77%, 81.73% { opacity: 0; x: 11px; y: 356px; width: 218px; height: 33px; }
        81.74%, 84.61% { opacity: 1; x: 11px; y: 356px; width: 218px; height: 33px; }
        /* TS23 */
        84.62%, 85.57% { opacity: 0; x: 41px; y: 391px; width: 68px; height: 38px; }
        85.58%, 88.46% { opacity: 1; x: 41px; y: 391px; width: 68px; height: 38px; }
        /* TS24 */
        88.47%, 89.42% { opacity: 0; x: 121px; y: 391px; width: 68px; height: 38px; }
        89.43%, 92.30% { opacity: 1; x: 121px; y: 391px; width: 68px; height: 38px; }
        /* TS25 */
        92.31%, 93.26% { opacity: 0; x: 26px; y: 438px; width: 188px; height: 28px; }
        93.27%, 96.15% { opacity: 1; x: 26px; y: 438px; width: 188px; height: 28px; }
        /* Grand Finale Zoom Out */
        96.16%, 100% { opacity: 0; }
      }

      /* =========================================
         LAYER 3: NARRATION BANNER VISIBILITY TIMING
         ========================================= */

        font-family: Arial, sans-serif;
        font-size: 15px;
        font-weight: bold;
        fill: #111111;
        text-anchor: middle;
        animation-duration: 52s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }

      @keyframes narr11 { 0%, 38.46% { opacity: 0; } 39.43%, 42.2% { opacity: 1; } 42.31%, 100% { opacity: 0; } }
      @keyframes narr12 { 0%, 42.30% { opacity: 0; } 43.27%, 46.0% { opacity: 1; } 46.16%, 100% { opacity: 0; } }
      @keyframes narr13 { 0%, 46.15% { opacity: 0; } 47.12%, 49.9% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
      @keyframes narr14 { 0%, 50.00% { opacity: 0; } 50.97%, 53.7% { opacity: 1; } 53.85%, 100% { opacity: 0; } }
      @keyframes narr15 { 0%, 53.84% { opacity: 0; } 54.81%, 57.5% { opacity: 1; } 57.70%, 100% { opacity: 0; } }
      @keyframes narr16 { 0%, 57.69% { opacity: 0; } 58.66%, 61.4% { opacity: 1; } 61.54%, 100% { opacity: 0; } }
      @keyframes narr17 { 0%, 61.53% { opacity: 0; } 62.51%, 65.2% { opacity: 1; } 65.39%, 100% { opacity: 0; } }
      @keyframes narr18 { 0%, 65.38% { opacity: 0; } 66.35%, 69.1% { opacity: 1; } 69.24%, 100% { opacity: 0; } }
      @keyframes narr19 { 0%, 69.23% { opacity: 0; } 70.20%, 72.9% { opacity: 1; } 73.08%, 100% { opacity: 0; } }

      #narr_ts1 { animation-name: narr1; }
      #narr_ts2 { animation-name: narr2; }

       DYNAMIC NARRATION BANNER

  <g id="narration_banner">
    <rect x="20" y="405" width="920" height="70" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" rx="8" />
    <text id="narr_ts1" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The pipeline initiates with raw inputs for the comprehensive scene representation.</tspan>
    </text>
    <text id="narr_ts2" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Inputs include 3D Point Clouds, RGB Images, and Depth Images with Camera Poses.</tspan>
    </text>
    <text id="narr_ts3" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">RGB images are collected to construct accurate colour representation.</tspan>
    </text>
    <text id="narr_ts4" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Depth images and poses are recorded simultaneously.</tspan>
    </text>
    <text id="narr_ts5" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Step 1: 3D-Aware 2D Mask Tracking process begins.</tspan>
    </text>
    <text id="narr_ts6" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Superpoints are selected and projected into a histogram.</tspan>
    </text>
    <text id="narr_ts7" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">A histogram is generated to track spatial data.</tspan>
    </text>
    <text id="narr_ts8" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">An optimal pivot view is determined based on the histogram data.</tspan>
    </text>
    <text id="narr_ts9" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">SAM 2 Segmentation is applied within the selected pivot view.</tspan>
    </text>
    <text id="narr_ts10" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">This extracts a highly accurate 2D mask in the pivot view.</tspan>
    </text>
    <text id="narr_ts11" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">SAM 2 Tracking utilizes this mask along with 3D spatial cues.</tspan>
    </text>
    <text id="narr_ts12" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Spatial cues actively guide the SAM 2 boundaries.</tspan>
    </text>
    <text id="narr_ts13" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Bidirectional tracking produces a complete 2D Mask Track sequence.</tspan>
    </text>
    <text id="narr_ts14" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The complete 2D Mask Sequence is fully assembled.</tspan>
    </text>
    <text id="narr_ts15" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Step 2: 3D Proposal Refinement Via Mask Optimization.</tspan>
    </text>
    <text id="narr_ts16" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The 2D sequence is lifted to form an initial 3D Mask Candidate.</tspan>
    </text>
    <text id="narr_ts17" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The candidate is rigorously refined using Algorithm 1 optimization.</tspan>
    </text>
    <text id="narr_ts18" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">A Final 3D Proposal is generated for Class-Agnostic Segmentation.</tspan>
    </text>
    <text id="narr_ts19" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The class-agnostic 3D instance segments form the structural foundation.</tspan>
    </text>
    <text id="narr_ts20" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The refined segments are passed to the Output stage for labeling.</tspan>
    </text>
    <text id="narr_ts21" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Open-Vocab 3D Instance Segmentation categorizes the data.</tspan>
    </text>
    <text id="narr_ts22" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Open-Ended 3D Instance Segmentation handles complex semantic bounds.</tspan>
    </text>
    <text id="narr_ts23" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">CLIP processes the visual semantic embeddings.</tspan>
    </text>
    <text id="narr_ts24" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">LLMs provide textual reasoning to support the prediction.</tspan>
    </text>
    <text id="narr_ts25" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Output labels are finally attached to the components.</tspan>
    </text>
    <text id="narr_ts26" class="narrative_text" x="480" y="445">
      <!--[cite: 1] -->
      <tspan x="480" dy="0">Grand Finale: Complete architectural overview of the pipeline[cite: 1].</tspan>
    </text>
