<style>html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden}svg{display:block;width:100%;height:100%}</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <style>
      /* =========================================
         LAYER 1: CINEMATIC CAMERA RIG
         Pacing: 32s total (2s per step, 16 steps total)
         Safe Viewport: 960x480 (Top 480px)
         Pan takes 0.5s (1.56%), Hold takes 1.5s (4.69%)
         ========================================= */
      #camera_rig {
        transform-origin: 0 0;
        animation: cameraPan 32s ease-in-out infinite;
      }

      @keyframes cameraPan {
        /* DYNAMIC START: Actively zoom into TS1 as it fades in */
        0% { transform: translate(0px, 0px) scale(1); }
        
        /* TS1 (0s-2s): Input Block */
        1.56%, 6.25% { transform: translate(264px, -16.5px) scale(1.8); }
        
        /* TS2 (2s-4s): Raster Images */
        7.81%, 12.50% { transform: translate(219.3px, -98.8px) scale(2.2); }
        
        /* TS3 (4s-6s): Step 1 Macro Reset */
        14.06%, 18.75% { transform: translate(-240px, 78px) scale(1.2); }
        
        /* TS4 (6s-8s): Superpoint & Histogram */
        20.31%, 25.00% { transform: translate(-320px, -72.5px) scale(2.5); }
        
        /* TS5 (8s-10s): Pivot View */
        26.56%, 31.25% { transform: translate(-595px, -191.3px) scale(2.5); }
        
        /* TS6 (10s-12s): SAM 2 Segmentation */
        32.81%, 37.50% { transform: translate(-595px, 35px) scale(2.5); }
        
        /* TS7 (12s-14s): 2D Mask in Pivot View */
        39.06%, 43.75% { transform: translate(-907.5px, 33.8px) scale(2.5); }
        
        /* TS8 (14s-16s): SAM 2 Tracking & Cues */
        45.31%, 50.00% { transform: translate(-1220px, 56.3px) scale(2.5); }
        
        /* TS9 (16s-18s): Bidirectional Mask Track */
        51.56%, 56.25% { transform: translate(-700px, 32px) scale(1.6); }
        
        /* TS10 (18s-20s): Step 2 Macro Reset */
        57.81%, 62.50% { transform: translate(-300px, -244.3px) scale(1.3); }
        
        /* TS11 (20s-22s): Lifting */
        64.06%, 68.75% { transform: translate(-1720px, -678.8px) scale(2.5); }
        
        /* TS12 (22s-24s): Refining */
        70.31%, 75.00% { transform: translate(-1282.5px, -678.8px) scale(2.5); }
        
        /* TS13 (24s-26s): 3D Proposal & Agnostic */
        76.56%, 81.25% { transform: translate(-375px, -545px) scale(2.0); }
        
        /* TS14 (26s-28s): Output Macro Reset */
        82.81%, 87.50% { transform: translate(276px, -414.5px) scale(1.7); }
        
        /* TS15 (28s-30s): Vocab & Output Labels */
        89.06%, 93.75% { transform: translate(240px, -540px) scale(2.0); }
        
        /* GRAND FINALE (30s-32s): Global Zoom Out & Hold */
        95.31%, 100% { transform: translate(0px, 0px) scale(1); }
      }

      /* =========================================
         LAYER 2: PROGRESSIVE REVEAL BASE
         Synced to 32s Loop (1 slice = 6.25%)
         Linear fades to synchronize with camera pans
         ========================================= */
      .rev_ts1, .rev_ts2, .rev_ts3, .rev_ts4, .rev_ts5, 
      .rev_ts6, .rev_ts7, .rev_ts8, .rev_ts9, .rev_ts10, 
      .rev_ts11, .rev_ts12, .rev_ts13, .rev_ts14, .rev_ts15 {
        opacity: 0;
        animation-duration: 32s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }

      .rev_ts1  { animation-name: rev_ts1_anim; }
      .rev_ts2  { animation-name: rev_ts2_anim; }
      .rev_ts3  { animation-name: rev_ts3_anim; }
      .rev_ts4  { animation-name: rev_ts4_anim; }
      .rev_ts5  { animation-name: rev_ts5_anim; }
      .rev_ts6  { animation-name: rev_ts6_anim; }
      .rev_ts7  { animation-name: rev_ts7_anim; }
      .rev_ts8  { animation-name: rev_ts8_anim; }
      .rev_ts9  { animation-name: rev_ts9_anim; }
      .rev_ts10 { animation-name: rev_ts10_anim; }
      .rev_ts11 { animation-name: rev_ts11_anim; }
      .rev_ts12 { animation-name: rev_ts12_anim; }
      .rev_ts13 { animation-name: rev_ts13_anim; }
      .rev_ts14 { animation-name: rev_ts14_anim; }
      .rev_ts15 { animation-name: rev_ts15_anim; }

      @keyframes rev_ts1_anim  { 0% { opacity: 0; } 1.56% { opacity: 1; } 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts2_anim  { 0%, 6.25% { opacity: 0; } 7.81%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts3_anim  { 0%, 12.50% { opacity: 0; } 14.06%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts4_anim  { 0%, 18.75% { opacity: 0; } 20.31%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts5_anim  { 0%, 25.00% { opacity: 0; } 26.56%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts6_anim  { 0%, 31.25% { opacity: 0; } 32.81%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts7_anim  { 0%, 37.50% { opacity: 0; } 39.06%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts8_anim  { 0%, 43.75% { opacity: 0; } 45.31%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts9_anim  { 0%, 50.00% { opacity: 0; } 51.56%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts10_anim { 0%, 56.25% { opacity: 0; } 57.81%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts11_anim { 0%, 62.50% { opacity: 0; } 64.06%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts12_anim { 0%, 68.75% { opacity: 0; } 70.31%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts13_anim { 0%, 75.00% { opacity: 0; } 76.56%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts14_anim { 0%, 81.25% { opacity: 0; } 82.81%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes rev_ts15_anim { 0%, 87.50% { opacity: 0; } 89.06%, 98% { opacity: 1; } 100% { opacity: 0; } }

      /* =========================================
         LAYER 3: NARRATION BANNER VISIBILITY TIMING
         Hard-gaps included between transitions
         ========================================= */
    </style>
  </defs>
