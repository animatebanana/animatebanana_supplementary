<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <style>
      /* =========================================
         LAYER 1: CINEMATIC CAMERA RIG (PAN & ZOOM)
         Pacing: 36s total (18 distinct steps * 2.0s)
         Safe Viewport: 960x405 (Top 405px, leaving 75px for banner)
         Center = X:480, Y:202.5
         Logic: Camera PANS (0.5s), ARRIVES. 
         Camera HOLDS perfectly still while element colors up.
         ========================================= */
      #camera_rig {
        transform-origin: 0 0;
        animation: cameraPan 36s ease-in-out infinite;
      }

      @keyframes cameraPan {
        /* Start Global View */
        0% { transform: translate(0px, 0px) scale(1); }
        
        /* TS1 (0-2s): INPUT BLOCK */
        1.38%, 5.55% { transform: translate(336px, 31.5px) scale(1.2); }
        
        /* TS2 (2-4s): RASTERS */
        6.94%, 11.11% { transform: translate(314px, -13px) scale(1.4); }
        
        /* TS3 (4-6s): STEP 1 OVERVIEW (Macro Reset) */
        12.50%, 16.66% { transform: translate(-180px, 54px) scale(1.1); }
        
        /* TS4 (6-8s): SUPERPOINT & HISTOGRAM */
        18.05%, 22.22% { transform: translate(-224px, -72.5px) scale(2.2); }
        
        /* TS5 (8-10s): PIVOT VIEW */
        23.61%, 27.77% { transform: translate(-595px, -228.7px) scale(2.5); }
        
        /* TS6 (10-12s): SAM 2 SEGMENTATION */
        29.16%, 33.33% { transform: translate(-595px, -2.5px) scale(2.5); }
        
        /* TS7 (12-14s): 2D MASK PIVOT */
        34.72%, 38.88% { transform: translate(-907.5px, -3.7px) scale(2.5); }
        
        /* TS8 (14-16s): SAM 2 TRACK & CUES */
        40.27%, 44.44% { transform: translate(-1220px, 18.7px) scale(2.5); }
        
        /* TS9 (16-18s): BIDIRECTIONAL MASK */
        45.83%, 50.00% { transform: translate(-700px, -5.5px) scale(1.6); }
        
        /* TS10 (18-20s): STEP 2 OVERVIEW (Macro Reset) */
        51.38%, 55.55% { transform: translate(-240px, -244.5px) scale(1.2); }
        
        /* TS11 (20-22s): LIFTING */
        56.94%, 61.11% { transform: translate(-1720px, -716.2px) scale(2.5); }
        
        /* TS12 (22-24s): REFINING */
        62.50%, 66.66% { transform: translate(-1282.5px, -716.2px) scale(2.5); }
        
        /* TS13 (24-26s): FINAL 3D PROPOSAL */
        68.05%, 72.22% { transform: translate(-882.5px, -716.2px) scale(2.5); }
        
        /* TS14 (26-28s): CLASS AGNOSTIC */
        73.61%, 77.77% { transform: translate(-181.5px, -504px) scale(1.8); }
        
        /* TS15 (28-30s): OUTPUT OVERVIEW */
        79.16%, 83.33% { transform: translate(288px, -413.5px) scale(1.6); }
        
        /* TS16 (30-32s): OUTPUT EDGE TRANSITION */
        84.72%, 88.88% { transform: translate(288px, -413.5px) scale(1.6); }
        
        /* TS17 (32-34s): OPEN VOCAB & LABELS */
        90.27%, 94.44% { transform: translate(264px, -526.5px) scale(1.8); }
        
        /* TS18 (34-36s): GRAND FINALE (Global Zoom Out & Hold) */
        95.83%, 100% { transform: translate(0px, 0px) scale(1); }
      }

      /* =========================================
         LAYER 2: COLOUR POP BASE
         Logic: The fade triggers ONLY AFTER the camera has completely arrived.
         It takes 0.5s to color pop, leaving 1.0s of steady reading time before the next pan.
         ========================================= */
      #block_input, #raster_3d_point_cloud, #raster_rgb_images, #raster_depth_images, #block_step1, #raster_superpoint, #raster_histogram, #edge_3d_to_superpoint, #edge_rgb_to_histogram, #edge_depth_to_histogram, #raster_pivot_view, #edge_histogram_to_pivot, #node_sam2_seg, #edge_superpoint_to_sam2, #edge_pivot_to_sam2, #raster_2d_mask_pivot, #edge_sam2_to_mask, #node_sam2_track, #text_3d_cues, #edge_mask_to_track, #edge_cues_to_track, #raster_bidirectional, #raster_2d_mask_track, #edge_track_to_bidirectional, #edge_track_to_sequence, #block_step2, #node_lifting, #edge_sequence_to_lifting, #node_refining, #edge_lifting_to_refining, #raster_final_3d_proposal, #edge_refining_to_proposal, #raster_class_agnostic, #edge_proposal_to_agnostic, #block_output, #edge_agnostic_to_output, #node_open_vocab, #node_open_ended, #node_clip, #node_llm, #node_output_labels {
        filter: grayscale(100%) opacity(0.4);
        animation-duration: 36s;
        animation-iteration-count: infinite;
        animation-fill-mode: forwards;
      }

      @keyframes cp1  { 0%, 1.38% { filter: grayscale(100%) opacity(0.4); } 2.77%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp2  { 0%, 6.94% { filter: grayscale(100%) opacity(0.4); } 8.33%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp3  { 0%, 12.50% { filter: grayscale(100%) opacity(0.4); } 13.88%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp4  { 0%, 18.05% { filter: grayscale(100%) opacity(0.4); } 19.44%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp5  { 0%, 23.61% { filter: grayscale(100%) opacity(0.4); } 25.00%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp6  { 0%, 29.16% { filter: grayscale(100%) opacity(0.4); } 30.55%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp7  { 0%, 34.72% { filter: grayscale(100%) opacity(0.4); } 36.11%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp8  { 0%, 40.27% { filter: grayscale(100%) opacity(0.4); } 41.66%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp9  { 0%, 45.83% { filter: grayscale(100%) opacity(0.4); } 47.22%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp10 { 0%, 51.38% { filter: grayscale(100%) opacity(0.4); } 52.77%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp11 { 0%, 56.94% { filter: grayscale(100%) opacity(0.4); } 58.33%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp12 { 0%, 62.50% { filter: grayscale(100%) opacity(0.4); } 63.88%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp13 { 0%, 68.05% { filter: grayscale(100%) opacity(0.4); } 69.44%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp14 { 0%, 73.61% { filter: grayscale(100%) opacity(0.4); } 75.00%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp15 { 0%, 79.16% { filter: grayscale(100%) opacity(0.4); } 80.55%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp16 { 0%, 84.72% { filter: grayscale(100%) opacity(0.4); } 86.11%, 100% { filter: grayscale(0%) opacity(1); } }
      @keyframes cp17 { 0%, 90.27% { filter: grayscale(100%) opacity(0.4); } 91.66%, 100% { filter: grayscale(0%) opacity(1); } }

      #block_input { animation-name: cp1; }
      #raster_3d_point_cloud, #raster_rgb_images, #raster_depth_images { animation-name: cp2; }
      #block_step1 { animation-name: cp3; }
      #raster_superpoint, #raster_histogram, #edge_3d_to_superpoint, #edge_rgb_to_histogram, #edge_depth_to_histogram { animation-name: cp4; }
      #raster_pivot_view, #edge_histogram_to_pivot { animation-name: cp5; }
      #node_sam2_seg, #edge_superpoint_to_sam2, #edge_pivot_to_sam2 { animation-name: cp6; }
      #raster_2d_mask_pivot, #edge_sam2_to_mask { animation-name: cp7; }
      #node_sam2_track, #text_3d_cues, #edge_mask_to_track, #edge_cues_to_track { animation-name: cp8; }
      #raster_bidirectional, #raster_2d_mask_track, #edge_track_to_bidirectional, #edge_track_to_sequence { animation-name: cp9; }
      #block_step2 { animation-name: cp10; }
      #node_lifting, #edge_sequence_to_lifting { animation-name: cp11; }
      #node_refining, #edge_lifting_to_refining { animation-name: cp12; }
      #raster_final_3d_proposal, #edge_refining_to_proposal { animation-name: cp13; }
      #raster_class_agnostic, #edge_proposal_to_agnostic { animation-name: cp14; }
      #block_output { animation-name: cp15; }
      #edge_agnostic_to_output { animation-name: cp16; }
      #node_open_vocab, #node_open_ended, #node_clip, #node_llm, #node_output_labels { animation-name: cp17; }

      /* =========================================
         LAYER 3: NARRATION BANNER VISIBILITY TIMING
         ========================================= */
      .narrative_text {
        opacity: 0;
        font-family: Arial, sans-serif;
        font-size: 15px;
        font-weight: bold;
        fill: #333333;
        text-anchor: middle;
        animation-duration: 36s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }

      @keyframes narr1  { 0%, 0.1% { opacity: 0; } 1.38%, 5.3% { opacity: 1; } 5.55%, 100% { opacity: 0; } }
      @keyframes narr2  { 0%, 5.55% { opacity: 0; } 6.94%, 10.8% { opacity: 1; } 11.11%, 100% { opacity: 0; } }
      @keyframes narr3  { 0%, 11.11% { opacity: 0; } 12.50%, 16.4% { opacity: 1; } 16.66%, 100% { opacity: 0; } }
      @keyframes narr4  { 0%, 16.66% { opacity: 0; } 18.05%, 21.9% { opacity: 1; } 22.22%, 100% { opacity: 0; } }
      @keyframes narr5  { 0%, 22.22% { opacity: 0; } 23.61%, 27.5% { opacity: 1; } 27.77%, 100% { opacity: 0; } }
      @keyframes narr6  { 0%, 27.77% { opacity: 0; } 29.16%, 33.1% { opacity: 1; } 33.33%, 100% { opacity: 0; } }
      @keyframes narr7  { 0%, 33.33% { opacity: 0; } 34.72%, 38.6% { opacity: 1; } 38.88%, 100% { opacity: 0; } }
      @keyframes narr8  { 0%, 38.88% { opacity: 0; } 40.27%, 44.2% { opacity: 1; } 44.44%, 100% { opacity: 0; } }
      @keyframes narr9  { 0%, 44.44% { opacity: 0; } 45.83%, 49.8% { opacity: 1; } 50.00%, 100% { opacity: 0; } }
      @keyframes narr10 { 0%, 50.00% { opacity: 0; } 51.38%, 55.3% { opacity: 1; } 55.55%, 100% { opacity: 0; } }
      @keyframes narr11 { 0%, 55.55% { opacity: 0; } 56.94%, 60.9% { opacity: 1; } 61.11%, 100% { opacity: 0; } }
      @keyframes narr12 { 0%, 61.11% { opacity: 0; } 62.50%, 66.4% { opacity: 1; } 66.66%, 100% { opacity: 0; } }
      @keyframes narr13 { 0%, 66.66% { opacity: 0; } 68.05%, 72.0% { opacity: 1; } 72.22%, 100% { opacity: 0; } }
      @keyframes narr14 { 0%, 72.22% { opacity: 0; } 73.61%, 77.5% { opacity: 1; } 77.77%, 100% { opacity: 0; } }
      @keyframes narr15 { 0%, 77.77% { opacity: 0; } 79.16%, 83.1% { opacity: 1; } 83.33%, 100% { opacity: 0; } }
      @keyframes narr16 { 0%, 83.33% { opacity: 0; } 84.72%, 88.6% { opacity: 1; } 88.88%, 100% { opacity: 0; } }
      @keyframes narr17 { 0%, 88.88% { opacity: 0; } 90.27%, 94.2% { opacity: 1; } 94.44%, 100% { opacity: 0; } }
      @keyframes narr18 { 0%, 94.44% { opacity: 0; } 95.83%, 100% { opacity: 1; } }

      #narr_ts1 { animation-name: narr1; }
      #narr_ts2 { animation-name: narr2; }
      #narr_ts3 { animation-name: narr3; }
      #narr_ts4 { animation-name: narr4; }
      #narr_ts5 { animation-name: narr5; }
      #narr_ts6 { animation-name: narr6; }
      #narr_ts7 { animation-name: narr7; }
      #narr_ts8 { animation-name: narr8; }
      #narr_ts9 { animation-name: narr9; }
      #narr_ts10 { animation-name: narr10; }
      #narr_ts11 { animation-name: narr11; }
      #narr_ts12 { animation-name: narr12; }
      #narr_ts13 { animation-name: narr13; }
      #narr_ts14 { animation-name: narr14; }
      #narr_ts15 { animation-name: narr15; }
      #narr_ts16 { animation-name: narr16; }
      #narr_ts17 { animation-name: narr17; }
      #narr_ts18 { animation-name: narr18; }
    </style>
  </defs>

  <!-- ==================== BLOCK: CAMERA RIG ==================== -->
  <g id="camera_rig">
    <!-- INPUT -->
    <g id="block_input" data-id="block_input" data-class="block" data-parent="root">
      <rect x="5" y="5" width="230" height="275" rx="15" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="2"/>
      <text x="120" y="25" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">INPUT</text>
      
      <g id="raster_3d_point_cloud" data-id="raster_3d_point_cloud" data-class="raster_node" data-parent="block_input">
        <rect x="18" y="38" width="204" height="94" fill="none" stroke="#7030A0" stroke-width="2"/>
        <rect x="22" y="42" width="196" height="86" fill="#EAEAEA" stroke="#7F7F7F" stroke-dasharray="4,4" stroke-width="1.5"/>
        <text x="120" y="90" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">[3D Point Cloud Image]</text>
        <image href="rasters/3d-point-cloud.png" x="22" y="42" width="196" height="86" preserveAspectRatio="none"/>
        <text x="120" y="142" font-family="Arial" font-size="10" font-weight="bold" fill="#7030A0" text-anchor="middle">3D Point Cloud</text>
      </g>

      <g id="raster_rgb_images" data-id="raster_rgb_images" data-class="raster_node" data-parent="block_input">
        <rect x="15" y="155" width="100" height="45" fill="#EAEAEA" stroke="#7F7F7F" stroke-dasharray="4,4" stroke-width="1.5"/>
        <text x="65" y="182" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">[RGB Images]</text>
        <image href="rasters/full-RGB-images.png" x="15" y="155" width="100" height="45" preserveAspectRatio="none"/>
        <text x="65" y="212" font-family="Arial" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">RGB Images</text>
      </g>

      <g id="raster_depth_images" data-id="raster_depth_images" data-class="raster_node" data-parent="block_input">
        <rect x="15" y="225" width="100" height="45" fill="#EAEAEA" stroke="#7F7F7F" stroke-dasharray="4,4" stroke-width="1.5"/>
        <text x="65" y="252" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">[Depth + Poses]</text>
        <image href="rasters/full-depth-images-camera-poses.png" x="15" y="225" width="100" height="45" preserveAspectRatio="none"/>
        <text x="120" y="274" font-family="Arial" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">Depth Images + Camera Poses</text>
      </g>
    </g>

    <!-- STEP 1 -->
    <g id="block_step1" data-id="block_step1" data-class="block" data-parent="root">
      <rect x="245" y="5" width="710" height="260" rx="20" fill="#FDF3CD" stroke="#EBC360" stroke-width="2"/>
      <text x="260" y="28" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="start">Step 1: 3D-Aware 2D Mask Tracking</text>

      <g id="raster_superpoint" data-id="raster_superpoint" data-class="raster_node" data-parent="block_step1">

        <text x="310" y="87" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">[Superpoint]</text>
        <image href="rasters/superpoint-selection.png" x="270" y="55" width="80" height="55" preserveAspectRatio="none"/>
        <text x="310" y="50" font-family="Arial" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">Superpoint selection</text>
      </g>

      <g id="raster_histogram" data-id="raster_histogram" data-class="raster_node" data-parent="block_step1">
        <rect x="270" y="125" width="100" height="70" fill="#EAEAEA" stroke="#7F7F7F" stroke-dasharray="4,4" stroke-width="1.5"/>
        <text x="320" y="165" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">[Histogram]</text>
        <image href="rasters/hist-of-projected-pts.png" x="270" y="125" width="100" height="70" preserveAspectRatio="none"/>
        <text x="320" y="207" font-family="Arial" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">Histogram of</text>
        <text x="320" y="219" font-family="Arial" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">projected points</text>
      </g>

      <g id="raster_pivot_view" data-id="raster_pivot_view" data-class="raster_node" data-parent="block_step1">
        <rect x="390" y="145" width="80" height="55" fill="#EAEAEA" stroke="#7F7F7F" stroke-dasharray="4,4" stroke-width="1.5"/>
        <text x="430" y="177" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">[Pivot View]</text>
        <image href="rasters/pivot-view-selection.png" x="390" y="145" width="80" height="55" preserveAspectRatio="none"/>
        <text x="430" y="212" font-family="Arial" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">Pivot view</text>
        <text x="430" y="224" font-family="Arial" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">selection</text>
      </g>

      <g id="node_sam2_seg" data-id="node_sam2_seg" data-class="child_node" data-parent="block_step1">
        <rect x="380" y="62" width="100" height="40" rx="8" fill="#D9E1F2" stroke="#4472C4" stroke-width="1.5"/>
        <text x="430" y="78" font-family="Arial" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">SAM 2</text>
        <text x="430" y="92" font-family="Arial" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">Segmentation</text>
      </g>

      <g id="raster_2d_mask_pivot" data-id="raster_2d_mask_pivot" data-class="raster_node" data-parent="block_step1">
        <rect x="515" y="55" width="80" height="55" fill="#EAEAEA" stroke="#7F7F7F" stroke-dasharray="4,4" stroke-width="1.5"/>
        <text x="555" y="87" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">[2D Mask]</text>
        <image href="rasters/2d-mask-in-pivot-view.png" x="515" y="55" width="80" height="55" preserveAspectRatio="none"/>
        <text x="555" y="122" font-family="Arial" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">2D mask in pivot</text>
        <text x="555" y="134" font-family="Arial" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">view</text>
      </g>

      <g id="node_sam2_track" data-id="node_sam2_track" data-class="child_node" data-parent="block_step1">
        <rect x="630" y="62" width="100" height="40" rx="8" fill="#D9E1F2" stroke="#4472C4" stroke-width="1.5"/>
        <text x="680" y="78" font-family="Arial" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">SAM 2</text>
        <text x="680" y="92" font-family="Arial" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">Tracking</text>
      </g>

      <text id="text_3d_cues" data-id="text_3d_cues" data-class="child_node" data-parent="block_step1" x="680" y="45" font-family="Arial" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">3D cues</text>

      <g id="raster_bidirectional" data-id="raster_bidirectional" data-class="raster_node" data-parent="block_step1">
        <rect x="760" y="45" width="185" height="115" fill="#D9E1F2" stroke="#4472C4" stroke-width="1.5"/>

        <rect x="770" y="70" width="75" height="55" fill="#EAEAEA" stroke="#7F7F7F" stroke-dasharray="3,3" stroke-width="1"/>
        <text x="807" y="100" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">[Backward]</text>
        <image href="rasters/backward-pass.png" x="770" y="70" width="75" height="55" preserveAspectRatio="none"/>
        <text x="807" y="135" font-family="Arial" font-size="9" fill="#000" text-anchor="middle">Backward Pass</text>
        <rect x="860" y="70" width="75" height="55" fill="#EAEAEA" stroke="#7F7F7F" stroke-dasharray="3,3" stroke-width="1"/>
        <text x="897" y="100" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">[Forward]</text>
        <image href="rasters/forward-pass.png" x="860" y="70" width="75" height="55" preserveAspectRatio="none"/>
        <text x="897" y="135" font-family="Arial" font-size="9" fill="#000" text-anchor="middle">Forward Pass</text>
      </g>

      <g id="raster_2d_mask_track" data-id="raster_2d_mask_track" data-class="raster_node" data-parent="block_step1">

        <text x="690" y="198" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">[2D Mask Track Sequence]</text>
        <image href="rasters/2d-mask-track-full.png" x="530" y="175" width="320" height="40" preserveAspectRatio="none"/>
        <text x="690" y="228" font-family="Arial" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">2D Mask Track</text>
      </g>
    </g>

    <!-- STEP 2 -->
    <g id="block_step2" data-id="block_step2" data-class="block" data-parent="root">
      <rect x="245" y="270" width="710" height="205" rx="20" fill="#E2F0D9" stroke="#70AD47" stroke-width="2"/>

  <!-- ==================== BLOCK: NARRATION BANNER ==================== -->

    <rect x="20" y="410" width="920" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text id="narr_ts1" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The pipeline initiates with raw inputs for the comprehensive scene representation.</tspan>
    </text>
    <text id="narr_ts2" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Inputs include 3D Point Clouds, RGB Images, and Depth Images with Camera Poses.</tspan>
    </text>
    <text id="narr_ts3" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Step 1: 3D-Aware 2D Mask Tracking process begins.</tspan>
    </text>
    <text id="narr_ts4" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Superpoints are selected and projected into a histogram.</tspan>
    </text>
    <text id="narr_ts5" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">An optimal pivot view is determined based on the histogram data.</tspan>
    </text>
    <text id="narr_ts6" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">SAM 2 Segmentation is applied within the selected pivot view.</tspan>
    </text>
    <text id="narr_ts7" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">This extracts a highly accurate 2D mask in the pivot view.</tspan>
    </text>
    <text id="narr_ts8" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">SAM 2 Tracking utilizes this mask along with 3D spatial cues.</tspan>
    </text>
    <text id="narr_ts9" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Bidirectional tracking produces a complete 2D Mask Track sequence.</tspan>
    </text>
    <text id="narr_ts10" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Step 2: 3D Proposal Refinement Via Mask Optimization.</tspan>
    </text>
    <text id="narr_ts11" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The 2D sequence is lifted to form an initial 3D Mask Candidate.</tspan>
    </text>
    <text id="narr_ts12" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The candidate is rigorously refined using Algorithm 1 optimization.</tspan>
    </text>
    <text id="narr_ts13" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">A Final 3D Proposal is generated for Class-Agnostic Segmentation.</tspan>
    </text>
    <text id="narr_ts14" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The class-agnostic 3D instance segments form the structural foundation.</tspan>
    </text>
    <text id="narr_ts15" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">The refined segments are passed to the Output stage for labeling.</tspan>
    </text>
    <text id="narr_ts16" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Proposals are formally transitioned to the final evaluation models.</tspan>
    </text>
    <text id="narr_ts17" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">CLIP and LLMs provide open-vocab semantic output labels.</tspan>
    </text>
    <text id="narr_ts18" class="narrative_text" x="480" y="445">
      <tspan x="480" dy="0">Grand Finale: Complete architectural overview of the pipeline[cite: 1].</tspan>
    </text>
  </g>
