  <text x="300" y="146" class="bold" font-size="9.5">Second Stage</text>
</g>


<g class="stp s5">
  <path class="ar" d="M377 67 H386"/>
  <path d="M389 46 L411 54 L411 82 L389 90 Z" fill="#3f78c4" stroke="#2a5590"/>
  <text x="381" y="100" font-size="7.5" font-weight="bold" fill="#2a5590">Classifier</text>
  <path class="ar" d="M413 67 H428"/>
  <text x="430" y="64" class="bold" font-size="8">Real/</text>
  <text x="430" y="74" class="bold" font-size="8">Generated</text>
</g>


<g class="stp s6">
  <rect x="4" y="170" width="468" height="182" rx="4" fill="#fffbe8" stroke="#e0a21a" stroke-width="1.5"/>
  <rect x="4" y="170" width="92" height="16" fill="#fdeeb8" stroke="#e0a21a" stroke-width="1.5"/>
  <text x="10" y="182" class="bold" font-size="10">Our Method</text>
  <text x="168" y="349" class="bold" font-size="9.5">End-to-end Training</text>
</g>


<g class="stp s7">
  <g transform="translate(50,206)"><use href="#photo" transform="scale(0.8)"/></g>
  <text x="38" y="230" class="lbl">x</text>
  <g transform="translate(50,282)"><use href="#photo" transform="scale(0.8)"/></g>
  <text x="20" y="306" class="lbl">x</text><text x="27" y="309" font-size="6.5" font-style="italic">pse</text>
  <rect x="60" y="256" width="44" height="18" rx="4" fill="#b7e6a8" stroke="#4a9c3a"/>
  <text x="69" y="269" font-size="8.5" font-weight="bold" fill="#1f6e18">FMRE</text>
  <path class="ar" d="M96 227 H128"/>
  <path class="ar" d="M96 303 H128"/>
  <path class="ar" d="M106 265 H128"/>
  <path d="M132 238 L156 254 L156 272 L132 290 Z" fill="#f0a882" stroke="#c4714a"/>
  <path d="M156 254 L180 238 L180 290 L156 272 Z" fill="#f0a882" stroke="#c4714a"/>
  <text x="126" y="304" font-size="7.5" font-weight="bold" fill="#c4521f">Diffusion Model</text>
</g>


<g class="stp s8">
  <path class="ar" d="M182 248 H198"/>
  <path class="ar" d="M182 282 H198"/>
  <g transform="translate(200,216)"><use href="#photo" transform="scale(0.8)"/></g>
  <text x="222" y="272" class="lbl">x'</text>
  <g transform="translate(200,282)"><use href="#photo" transform="scale(0.8)"/></g>
  <text x="214" y="337" class="lbl">x'</text><text x="222" y="340" font-size="6.5" font-style="italic">pse</text>
  <path d="M160 196 H295" stroke="#d13a2a" stroke-width="1.3" stroke-dasharray="5 3" fill="none"/>
  <path d="M160 196 V236" stroke="#d13a2a" stroke-width="1.3" stroke-dasharray="5 3" fill="none"/>
  <path d="M295 196 V216" stroke="#d13a2a" stroke-width="1.3" stroke-dasharray="5 3" fill="none"/>
  <text x="228" y="193" class="bold" font-size="9.5" fill="#d13a2a">better alignment</text>
</g>


<g class="stp s9">
  <path class="ar" d="M78 206 V200 H262 V238"/>
  <path class="ar" d="M78 326 V334 H262 V296"/>
  <path class="ar" d="M246 242 H258"/>
  <path class="ar" d="M246 308 H258"/>
  <circle cx="266" cy="242" r="6" fill="#fff" stroke="#111"/><path d="M263 242h6" stroke="#111"/>
  <circle cx="266" cy="292" r="6" fill="#fff" stroke="#111"/><path d="M263 292h6" stroke="#111"/>
  <path class="ar" d="M273 242 H284"/>
  <path class="ar" d="M273 292 H284"/>
  <g transform="translate(286,220)"><use href="#resid" transform="scale(0.78)"/></g>
  <text x="290" y="276" class="lbl">x</text><text x="297" y="279" font-size="6.5" font-style="italic">rec</text>
  <g transform="translate(286,286)"><use href="#resid" transform="scale(0.78)"/></g>
  <text x="283" y="342" class="lbl">x</text><text x="290" y="345" font-size="6.5" font-style="italic">pse_rec</text>
</g>


<g class="stp s10">
  <path class="ar" d="M332 246 H344 V258"/>
  <path class="ar" d="M332 312 H344 V272"/>
  <circle cx="348" cy="265" r="6.5" fill="#fff" stroke="#111"/>
