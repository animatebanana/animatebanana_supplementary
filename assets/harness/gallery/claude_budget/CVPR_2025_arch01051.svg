  <path class="ar" d="M74 56 H96"/>
  <path d="M100 32 L124 48 L124 64 L100 80 L100 32 Z" fill="#f0a882" stroke="#c4714a"/>
  <path d="M124 48 L148 32 L148 80 L124 64 Z" fill="#f0a882" stroke="#c4714a"/>
