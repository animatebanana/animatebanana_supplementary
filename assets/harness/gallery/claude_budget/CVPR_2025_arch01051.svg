<svg xmlns="http://www.w3.org/2000/svg" width="476" height="356" viewBox="0 0 476 356" font-family="Arial, Helvetica, sans-serif">
<defs>
  <linearGradient id="phA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9ec5e8"/><stop offset="0.45" stop-color="#cfe0ef"/>
    <stop offset="0.46" stop-color="#7c8f5a"/><stop offset="1" stop-color="#4a5c33"/>
  </linearGradient>
  <linearGradient id="phB" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b8743f"/><stop offset="0.5" stop-color="#e0b58a"/><stop offset="1" stop-color="#6d4426"/>
  </linearGradient>
  <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c8743a"/><stop offset="0.35" stop-color="#e3b27f"/>
    <stop offset="0.7" stop-color="#8c5a33"/><stop offset="1" stop-color="#3f2d1e"/>
  </linearGradient>
  <radialGradient id="res" cx="0.5" cy="0.45" r="0.6">
    <stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0a0a0a"/>
  </radialGradient>

  <g id="photo">
    <rect width="56" height="52" fill="url(#phA)"/>
    <ellipse cx="34" cy="30" rx="13" ry="17" fill="url(#phB)"/>
    <circle cx="34" cy="18" r="7" fill="#e8c6a4"/>
    <path d="M0 40 L14 26 L26 40 L40 30 L56 44 L56 52 L0 52 Z" fill="#53632f" opacity="0.8"/>
    <rect width="56" height="52" fill="none" stroke="#5b5b5b" stroke-width="1"/>
  </g>
  <g id="resid">
    <rect width="56" height="52" fill="url(#res)"/>
    <ellipse cx="34" cy="26" rx="11" ry="15" fill="#5a5a5a" opacity="0.35"/>
    <circle cx="34" cy="16" r="6" fill="#8a8a8a" opacity="0.4"/>
    <rect width="56" height="52" fill="none" stroke="#444" stroke-width="1"/>
  </g>

  <style><![CDATA[
    .stp { opacity: 0.3; animation-duration: 30s; animation-timing-function: linear;
           animation-fill-mode: forwards; animation-iteration-count: infinite; }
    @keyframes k1  {0%,0%{opacity:.3}  3.33%,100%{opacity:1}}
    @keyframes k2  {0%,10%{opacity:.3} 13.33%,100%{opacity:1}}
    @keyframes k3  {0%,20%{opacity:.3} 23.33%,100%{opacity:1}}
    @keyframes k4  {0%,30%{opacity:.3} 33.33%,100%{opacity:1}}
    @keyframes k5  {0%,40%{opacity:.3} 43.33%,100%{opacity:1}}
    @keyframes k6  {0%,50%{opacity:.3} 53.33%,100%{opacity:1}}
    @keyframes k7  {0%,60%{opacity:.3} 63.33%,100%{opacity:1}}
    @keyframes k8  {0%,70%{opacity:.3} 73.33%,100%{opacity:1}}
    @keyframes k9  {0%,80%{opacity:.3} 83.33%,100%{opacity:1}}
    @keyframes k10 {0%,90%{opacity:.3} 93.33%,100%{opacity:1}}
    .s1{animation-name:k1}  .s2{animation-name:k2}  .s3{animation-name:k3}
    .s4{animation-name:k4}  .s5{animation-name:k5}  .s6{animation-name:k6}
    .s7{animation-name:k7}  .s8{animation-name:k8}  .s9{animation-name:k9}
    .s10{animation-name:k10}
    text{font-size:9px;fill:#111}
    .lbl{font-style:italic;font-size:10px}
    .bold{font-weight:bold}
    .ar{stroke:#111;stroke-width:1.4;fill:none;marker-end:url(#arw)}
  ]]></style>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
  </marker>
</defs>

<rect width="476" height="356" fill="#ffffff"/>


<g class="stp s1">
  <rect x="4" y="6" width="468" height="155" rx="4" fill="#eaf2fc" stroke="#3b6fb6" stroke-width="1.5"/>
  <rect x="4" y="6" width="112" height="16" fill="#cfe0f6" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="10" y="18" class="bold" font-size="10">Existing Method</text>
  <rect x="352" y="10" width="116" height="30" fill="#ffffff" stroke="#8aa8cc"/>
  <circle cx="361" cy="19" r="4.5" fill="none" stroke="#111"/><path d="M358.5 19h5" stroke="#111"/>
  <text x="370" y="22" font-size="7.5">absolute operation</text>
  <circle cx="361" cy="32" r="4.5" fill="none" stroke="#111"/><circle cx="361" cy="32" r="2" fill="none" stroke="#111"/>
  <text x="370" y="35" font-size="7.5">concat operation</text>
</g>


<g class="stp s2">
  <g transform="translate(14,30)"><use href="#photo"/></g>
