  <text x="178" y="146" class="bold" font-size="9.5" fill="#2e8b3a">w/o interaction</text>
</g>


<g class="stp s4">
  <g transform="translate(250,16)" ><use href="#photo" transform="scale(0.78)"/></g>
  <text x="272" y="68" class="lbl">x</text>
  <g transform="translate(250,74)"><use href="#photo" transform="scale(0.78)"/></g>
  <text x="272" y="126" class="lbl">x'</text>
  <path class="ar" d="M295 36 H306 V62"/>
  <path class="ar" d="M295 94 H306 V72"/>
