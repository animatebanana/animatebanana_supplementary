  <defs>

    <marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

    <style>
      /* Base Ghosting */
      [data-class="block"], [data-class="child_node"], [data-class="text_node"], 
      [data-class="edge"], [data-class="composite_whole"], [data-class="raster_node"] {
        opacity: 0.15;
        transition: opacity 0.1s ease;
      }

      /* Dynamic Subtitle Defaults */
      .narrative-text {
        opacity: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11.5px;
        fill: #222222;
        font-weight: 500;
      }

      /* Keyframes for Slices (7 slices: ~14.286% each) */
      @keyframes anim_t1 {
        0% { opacity: 1; }
        14.285% { opacity: 1; }
        14.286% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t2 {
        0% { opacity: 0.15; }
        14.285% { opacity: 0.15; }
        14.286% { opacity: 1; }
        28.571% { opacity: 1; }
        28.572% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t3 {
        0% { opacity: 0.15; }
        28.571% { opacity: 0.15; }
        28.572% { opacity: 1; }
        42.857% { opacity: 1; }
        42.858% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t4 {
        0% { opacity: 0.15; }
        42.857% { opacity: 0.15; }
        42.858% { opacity: 1; }
        57.142% { opacity: 1; }
        57.143% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t4_t5 {
        0% { opacity: 0.15; }
        42.857% { opacity: 0.15; }
        42.858% { opacity: 1; }
        71.428% { opacity: 1; }
        71.429% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t5 {
        0% { opacity: 0.15; }
        57.142% { opacity: 0.15; }
        57.143% { opacity: 1; }
        71.428% { opacity: 1; }
        71.429% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t6 {
        0% { opacity: 0.15; }
        71.428% { opacity: 0.15; }
        71.429% { opacity: 1; }
        85.714% { opacity: 1; }
        85.715% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t6_t7 {
        0% { opacity: 0.15; }
        71.428% { opacity: 0.15; }
        71.429% { opacity: 1; }
        100% { opacity: 1; }
      }

      @keyframes anim_t7 {
        0% { opacity: 0.15; }
        85.714% { opacity: 0.15; }
        85.715% { opacity: 1; }
        100% { opacity: 1; }
      }

      /* Narration Text Keyframes */
      @keyframes anim_narr_1 {
        0% { opacity: 1; }
        14.285% { opacity: 1; }
        14.286% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_2 {
        0% { opacity: 0; }
        14.285% { opacity: 0; }
        14.286% { opacity: 1; }
        28.571% { opacity: 1; }
        28.572% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_3 {
        0% { opacity: 0; }
        28.571% { opacity: 0; }
        28.572% { opacity: 1; }
        42.857% { opacity: 1; }
        42.858% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_4 {
        0% { opacity: 0; }
        42.857% { opacity: 0; }
        42.858% { opacity: 1; }
        57.142% { opacity: 1; }
        57.143% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_5 {
        0% { opacity: 0; }
        57.142% { opacity: 0; }
        57.143% { opacity: 1; }
        71.428% { opacity: 1; }
        71.429% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_6 {
        0% { opacity: 0; }
        71.428% { opacity: 0; }
        71.429% { opacity: 1; }
        85.714% { opacity: 1; }
        85.715% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_7 {
        0% { opacity: 0; }
        85.714% { opacity: 0; }
        85.715% { opacity: 1; }
        100% { opacity: 1; }
      }

      /* Timestamp 1 bindings */
      #block_legend, #block_input_image, #raster_input_photo, #box_woman, #badge_1_bg, #badge_1_text,
      #box_hat, #badge_2_bg, #badge_2_text, #box_drink, #badge_3_bg, #badge_3_text, #box_man,
      #badge_4_bg, #badge_4_text, #legend_bp_prop, #legend_td_prop, #legend_belief_select, #legend_gating {
        animation: anim_t1 28s infinite;
      }

      /* Timestamp 2 bindings */
      #block_text_input, #text_caption_line1, #text_caption_line2 {
        animation: anim_t2 28s infinite;
      }

      /* Timestamp 3 bindings */
      #block_language_graph, #node_lg_woman, #text_lg_woman, #node_lg_carry, #text_lg_carry,
      #node_lg_hold, #text_lg_hold, #node_lg_hat, #text_lg_hat, #node_lg_beverage, #text_lg_beverage,

      #edge_lg_carry_hat, #edge_lg_hold_bever {
        animation: anim_t3 28s infinite;
      }

      /* Timestamp 4 bindings */
      #block_initialization, #text_init_b_woman, #node_init_b_woman, #grid_init_vec_woman,
      #grid_init_mat_carry, #text_init_A_carry, #node_init_rect_carry, #text_init_A_hold,
      #node_init_rect_hold, #grid_init_mat_hold, #grid_init_vec_hat, #node_init_b_hat,
      #text_init_b_hat, #node_init_b_bever, #text_init_b_bever, #grid_init_vec_bever,
      #title_initialization, #edge_img_to_msg, #edge_lg_to_msg, #edge_init_root_left,
      #edge_init_split_carry, #edge_init_split_hold, #edge_init_carry_hat, #edge_init_hold_bever {
        animation: anim_t4 28s infinite;
      }

      /* Persistent Parent for T4-T5 */
      #block_message_propagation, #title_message_propagation {
        animation: anim_t4_t5 28s infinite;
      }

      /* Timestamp 5 bindings */
      #block_bptd_update, #node_bp_woman, #text_bp_woman, #node_bp_G, #text_bp_G,
      #node_bp_rect_hat, #node_bp_rect_bever, #node_bp_S_hat, #text_bp_S_hat,
      #node_bp_b_hat, #text_bp_b_hat, #node_bp_S_bever, #text_bp_S_bever,
      #node_bp_b_bever, #text_bp_b_bever, #node_td_woman, #text_td_woman,
      #node_td_S, #text_td_S, #node_td_rect_hat, #node_td_rect_bever,
      #node_td_G_hat, #text_td_G_hat, #node_td_b_hat, #text_td_b_hat,
      #node_td_G_bever, #text_td_G_bever, #node_td_b_bever, #text_td_b_bever,
      #title_bptd_update, #edge_bp_G_to_woman, #edge_bp_rect1_to_G, #edge_bp_rect2_to_G,
      #edge_bp_S_to_rect1, #edge_bp_hat_to_S, #edge_bp_S_to_rect2, #edge_bp_bever_to_S,
      #edge_td_woman_to_S, #edge_td_S_to_rect1, #edge_td_S_to_rect2, #edge_td_rect1_to_G,
      #edge_td_G_to_hat, #edge_td_rect2_to_G, #edge_td_G_to_bever {
        animation: anim_t5 28s infinite;
      }

      /* Timestamp 6 bindings */
      #block_itm_branch, #text_mlp_label, #node_itm_woman, #text_itm_woman,
      #node_itm_hat, #text_itm_hat, #node_itm_bever, #text_itm_bever,
      #text_itm_min, #btn_itm_pred, #text_itm_pred, #edge_mlp_conn,
      #edge_itm_root_hat, #edge_itm_root_bever, #edge_itm_to_pred {
        animation: anim_t6 28s infinite;
      }

      /* Persistent Parent for T6-T7 */
      #block_readout_head, #title_readout_head {
        animation: anim_t6_t7 28s infinite;
      }

      /* Timestamp 7 bindings */
      #block_mrr_branch, #text_diff_label, #text_mrr_carry, #node_mrr_woman,
      #node_mrr_hat, #node_mrr_bever, #text_mrr_label, #btn_mrr_pred,
      #text_mrr_pred, #edge_diff_arrow, #edge_mrr_root_hat, #edge_mrr_root_bever,
      #edge_mrr_to_pred {
        animation: anim_t7 28s infinite;
      }

      /* Narration Bindings */
      #narr_ts1 { animation: anim_narr_1 28s infinite; }
      #narr_ts2 { animation: anim_narr_2 28s infinite; }
      #narr_ts3 { animation: anim_narr_3 28s infinite; }
      #narr_ts4 { animation: anim_narr_4 28s infinite; }
      #narr_ts5 { animation: anim_narr_5 28s infinite; }
      #narr_ts6 { animation: anim_narr_6 28s infinite; }
      #narr_ts7 { animation: anim_narr_7 28s infinite; }
    </style>
  </defs>

  <!-- 7. DYNAMIC NARRATION BANNER               -->
  <!-- ========================================== -->
  <g id="narration_banner" transform="translate(0, 325)">
    <rect x="20" y="0" width="760" height="46" rx="6" ry="6" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>

    <text id="narr_ts1" class="narrative-text" x="50%" y="18" text-anchor="middle">
      <tspan x="50%" dy="0">Given an input image, an object detector generates candidate bounding box</tspan>
      <tspan x="50%" dy="16">proposals and extracts their initial region features.</tspan>
    </text>

    <text id="narr_ts2" class="narrative-text" x="50%" y="18" text-anchor="middle">
      <tspan x="50%" dy="0">Simultaneously, the input text expression describes the target visual scene</tspan>
      <tspan x="50%" dy="16">along with specific entity relationships.</tspan>
    </text>

    <text id="narr_ts3" class="narrative-text" x="50%" y="18" text-anchor="middle">
      <tspan x="50%" dy="0">A language parser converts the expression into a structured scene graph,</tspan>
      <tspan x="50%" dy="16">representing entity phrases as nodes and relations as edges.</tspan>
    </text>

    <text id="narr_ts4" class="narrative-text" x="50%" y="18" text-anchor="middle">
      <tspan x="50%" dy="0">In the message propagation module, initial local correspondence beliefs are</tspan>
      <tspan x="50%" dy="16">computed between each entity phrase and all candidate visual objects.</tspan>
    </text>

    <text id="narr_ts5" class="narrative-text" x="50%" y="18" text-anchor="middle">
      <tspan x="50%" dy="0">Two parallel passes perform bottom-up and top-down message propagation,</tspan>
      <tspan x="50%" dy="16">using context-sensitive belief selecting and gating to aggregate neighboring evidence.</tspan>
    </text>

    <text id="narr_ts6" class="narrative-text" x="50%" y="18" text-anchor="middle">
      <tspan x="50%" dy="0">The updated beliefs pass through an MLP to compute match probabilities,</tspan>
      <tspan x="50%" dy="16">which are minimum-pooled across nodes for image-text matching prediction.</tspan>
    </text>

    <text id="narr_ts7" class="narrative-text" x="50%" y="18" text-anchor="middle">
      <tspan x="50%" dy="0">Finally, computing confidence differences across graph edges detects relationship</tspan>
      <tspan x="50%" dy="16">inconsistencies, producing the mismatched relation reasoning prediction.</tspan>
    </text>
  </g>
