<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 700" width="1010" height="700">
  <defs>
    <style>
      #focus_box {
        animation: slide 18s ease-in-out infinite;
      }

      @keyframes slide {
        /* Timestamp 1: Input (Hold 0% - 13.33%, transition to 16.67%) */
        0%, 13.33% {
          x: 14px;
          y: 124px;
          width: 274px;
          height: 304px;
        }
        /* Timestamp 2: Representations Block (Hold 16.67% - 30.00%, transition to 33.33%) */
        16.67%, 30.00% {
          x: 350px;
          y: 4px;
          width: 253px;
          height: 578px;
        }
        /* Timestamp 3: PNCC (Hold 33.33% - 46.67%, transition to 50.00%) */
        33.33%, 46.67% {
          x: 366px;
          y: 20px;
          width: 222px;
          height: 244px;
        }
        /* Timestamp 4: 3D Offsets (Hold 50.00% - 63.33%, transition to 66.67%) */
        50.00%, 63.33% {
          x: 366px;
          y: 298px;
          width: 222px;
          height: 246px;
        }
        /* Timestamp 5: Point Cloud (Hold 66.67% - 80.00%, transition to 83.33%) */
        66.67%, 80.00% {
          x: 731px;
          y: 16px;
          width: 228px;
          height: 208px;
        }
        /* Timestamp 6: 3DMM (Hold 83.33% - 96.67%, transition to 100%) */
        83.33%, 96.67% {
          x: 731px;
          y: 274px;
          width: 242px;
          height: 276px;
        }
        /* Loop back smoothly to Timestamp 1 */
        100% {
          x: 14px;
          y: 124px;
          width: 274px;
          height: 304px;
        }
      }

      .narr-text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #222222;
        opacity: 0;
      }

      #narr_ts1 { animation: narr1 18s infinite; }
      #narr_ts2 { animation: narr2 18s infinite; }
      #narr_ts3 { animation: narr3 18s infinite; }
      #narr_ts4 { animation: narr4 18s infinite; }
      #narr_ts5 { animation: narr5 18s infinite; }
      #narr_ts6 { animation: narr6 18s infinite; }

      @keyframes narr1 {
        0%, 15.67% { opacity: 1; }
        16.67%, 100% { opacity: 0; }
      }
      @keyframes narr2 {
        0%, 15.67% { opacity: 0; }
        16.67%, 32.33% { opacity: 1; }
        33.33%, 100% { opacity: 0; }
      }
      @keyframes narr3 {
        0%, 32.33% { opacity: 0; }
        33.33%, 49.00% { opacity: 1; }
        50.00%, 100% { opacity: 0; }
      }
      @keyframes narr4 {
        0%, 49.00% { opacity: 0; }
        50.00%, 65.67% { opacity: 1; }
        66.67%, 100% { opacity: 0; }
      }
      @keyframes narr5 {
        0%, 65.67% { opacity: 0; }
        66.67%, 82.33% { opacity: 1; }
        83.33%, 100% { opacity: 0; }
      }
      @keyframes narr6 {
        0%, 82.33% { opacity: 0; }
        83.33%, 99.00% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Central Container Block -->
  <g id="block_representations" data-id="block_representations" data-class="block" data-parent="root">
    <rect id="rect_block_rep" x="354" y="8" width="245" height="570" rx="2" ry="2" fill="#d4d4d4" stroke="#c0c0c0" stroke-width="1"/>
    
    <!-- PNCC Raster Node -->
    <g id="node_pncc" data-id="node_pncc" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_pncc.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_pncc.png" x="370" y="24" width="214" height="236" preserveAspectRatio="xMidYMid meet" /></g>
    <text id="label_pncc" data-id="label_pncc" data-class="text_node" data-parent="block_representations" x="477" y="286" fill="#000000" font-family="Times New Roman, serif" font-size="24" text-anchor="middle">PNCC</text>

    <!-- 3D Offsets Raster Node -->
    <g id="node_offsets" data-id="node_offsets" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_offsets.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_offsets.png" x="370" y="302" width="214" height="238" preserveAspectRatio="xMidYMid meet" /></g>
    <text id="label_offsets" data-id="label_offsets" data-class="text_node" data-parent="block_representations" x="477" y="568" fill="#000000" font-family="Times New Roman, serif" font-size="24" text-anchor="middle">3D Offsets</text>
  </g>

  <!-- Left: Input Image Node -->
  <g id="node_input" data-id="node_input" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_input.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_input.png" x="18" y="128" width="258" height="296" preserveAspectRatio="xMidYMid meet" /></g>
  <text id="label_input" data-id="label_input" data-class="text_node" data-parent="root" x="147" y="454" fill="#000000" font-family="Times New Roman, serif" font-size="24" text-anchor="middle">Input</text>

  <!-- Right Top: Point Cloud Node -->
  <g id="node_point_cloud" data-id="node_point_cloud" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_point_cloud.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_point_cloud.png" x="735" y="20" width="220" height="200" preserveAspectRatio="xMidYMid meet" /></g>
  <text id="label_point_cloud" data-id="label_point_cloud" data-class="text_node" data-parent="root" x="845" y="246" fill="#000000" font-family="Times New Roman, serif" font-size="24" text-anchor="middle">Point Cloud</text>

  <!-- Right Bottom: 3DMM Node -->
  <g id="node_3dmm" data-id="node_3dmm" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_3dmm.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000104/crop_node_3dmm.png" x="735" y="278" width="234" height="268" preserveAspectRatio="xMidYMid meet" /></g>
  <text id="label_3dmm" data-id="label_3dmm" data-class="text_node" data-parent="root" x="852" y="574" fill="#000000" font-family="Times New Roman, serif" font-size="24" text-anchor="middle">3DMM</text>

  <!-- Connecting Edges -->
  <path id="edge_input_to_rep" data-id="edge_input_to_rep" data-class="edge" data-source="node_input" data-target="block_representations" d="M 0 -20 L 32 -20 L 32 -40 L 62 0 L 32 40 L 32 20 L 0 20 Z" transform="translate(288, 276)" fill="#adc7eb"/>
  <path id="edge_rep_to_point_cloud" data-id="edge_rep_to_point_cloud" data-class="edge" data-source="block_representations" data-target="node_point_cloud" d="M 0 -20 L 50 -20 L 50 -40 L 95 0 L 50 40 L 50 20 L 0 20 Z" transform="translate(606, 218) rotate(-26)" fill="#adc7eb"/>
  <path id="edge_rep_to_3dmm" data-id="edge_rep_to_3dmm" data-class="edge" data-source="block_representations" data-target="node_3dmm" d="M 0 -20 L 50 -20 L 50 -40 L 95 0 L 50 40 L 50 20 L 0 20 Z" transform="translate(606, 362) rotate(26)" fill="#adc7eb"/>

  <!-- Dynamic Narration Banner -->
  <g id="narration_banner">
    <text id="narr_ts1" class="narr-text" x="50%" y="640" text-anchor="middle">
      <tspan x="50%" dy="0">The pipeline begins with an unconstrained two-dimensional input image of a face.</tspan>
    </text>
    <text id="narr_ts2" class="narr-text" x="50%" y="630" text-anchor="middle">
      <tspan x="50%" dy="0">A convolutional neural network processes the image in a single pass</tspan>
      <tspan x="50%" dy="1.25em">to predict intermediate three-dimensional representations.</tspan>
    </text>
    <text id="narr_ts3" class="narr-text" x="50%" y="630" text-anchor="middle">
      <tspan x="50%" dy="0">Specifically, the network predicts the Projected Normalized Coordinate Code,</tspan>
      <tspan x="50%" dy="1.25em">providing a dense set of facial landmarks.</tspan>
    </text>
    <text id="narr_ts4" class="narr-text" x="50%" y="630" text-anchor="middle">
      <tspan x="50%" dy="0">In parallel, it outputs a three-dimensional offset image</tspan>
      <tspan x="50%" dy="1.25em">to capture precise geometric details.</tspan>
    </text>
    <text id="narr_ts5" class="narr-text" x="50%" y="640" text-anchor="middle">
      <tspan x="50%" dy="0">Together, the coordinate codes and offsets fully specify a dense three-dimensional point cloud.</tspan>
    </text>
    <text id="narr_ts6" class="narr-text" x="50%" y="630" text-anchor="middle">
      <tspan x="50%" dy="0">Alternatively, the predicted facial geometry is used as linear constraints</tspan>
      <tspan x="50%" dy="1.25em">to directly estimate parameters for a three-dimensional morphable model.</tspan>
    </text>
  </g>

  <!-- Sliding Focus Box -->
  <rect id="focus_box" fill="none" stroke="#FF0000" stroke-width="4" stroke-dasharray="8,4" rx="6" />
</svg>