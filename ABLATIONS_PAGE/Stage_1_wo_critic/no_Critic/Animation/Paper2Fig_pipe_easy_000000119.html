        animation-delay: 4.5s;
      }

      }

      @keyframes bannerShow {
        0% { opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes bannerHold {
        0% { opacity: 0; }
        10% { opacity: 1; }
        100% { opacity: 1; }
      }

      #narr_ts1 { animation: bannerShow 0.5s 0.0s forwards; }

  <!-- ==================== DYNAMIC NARRATION BANNER ==================== -->
  <g id="narration_banner">
    <rect x="40" y="450" width="880" height="56" rx="10" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    
    <text id="narr_ts1" class="narr-text" x="50%" y="483" text-anchor="middle">
      <tspan x="50%">The pipeline begins by constructing an image graph and evaluating depth reliability.</tspan>
    </text>

    <text id="narr_ts2" class="narr-text" x="50%" y="483" text-anchor="middle">
      <tspan x="50%">First, the framework takes the input RGB image.</tspan>
    </text>

    <text id="narr_ts3" class="narr-text" x="50%" y="483" text-anchor="middle">
      <tspan x="50%">It decomposes the RGB image into superpixels via SLIC segmentation to form the graph nodes.</tspan>
    </text>

    <text id="narr_ts4" class="narr-text" x="50%" y="483" text-anchor="middle">
      <tspan x="50%">In parallel, the corresponding depth image is received.</tspan>
    </text>

    <text id="narr_ts5" class="narr-text" x="50%" y="474" text-anchor="middle">
      <tspan x="50%">By analyzing the depth statistical distribution, the model computes a depth confidence measure</tspan>
      <tspan x="50%" dy="1.25em">to mitigate the influence of noisy depth maps.</tspan>
    </text>

    <text id="narr_ts6" class="narr-text" x="50%" y="483" text-anchor="middle">
      <tspan x="50%">The graph representation and confidence measure are forwarded to a two-stage saliency computation framework.</tspan>
    </text>

    <text id="narr_ts7" class="narr-text" x="50%" y="474" text-anchor="middle">
      <tspan x="50%">In Stage one, compactness saliency is calculated by evaluating spatial spread</tspan>
      <tspan x="50%" dy="1.25em">using both color and depth cues.</tspan>
    </text>

    <text id="narr_ts8" class="narr-text" x="50%" y="483" text-anchor="middle">
      <tspan x="50%">Next, a depth-refined foreground seed selection mechanism identifies reliable salient seeds.</tspan>
    </text>

    <text id="narr_ts9" class="narr-text" x="50%" y="474" text-anchor="middle">
      <tspan x="50%">In Stage two, foreground saliency is computed by measuring contrast against</tspan>
      <tspan x="50%" dy="1.25em">these seeds across color, depth, and texture cues.</tspan>
    </text>

    <text id="narr_ts10" class="narr-text" x="50%" y="483" text-anchor="middle">
      <tspan x="50%">The compactness and foreground saliency maps are fused together through a weighted sum.</tspan>
    </text>

    <text id="narr_ts11" class="narr-text" x="50%" y="474" text-anchor="middle">
      <tspan x="50%">Finally, the integrated saliency map is generated,</tspan>
      <tspan x="50%" dy="1.25em">accurately highlighting the salient object in comparison with the ground truth.</tspan>
