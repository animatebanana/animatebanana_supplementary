    <!-- Narration Subtitle Banner Container -->
    <g id="narration_banner">
        <rect x="50" y="340" width="900" height="48" rx="6" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
        <text id="narr_ts1" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The pipeline begins with an input referring expression describing specific fine-grained visual attributes.</tspan>
        </text>
        <text id="narr_ts2" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Alongside the text, a query image containing multiple candidate objects is provided.</tspan>
        </text>
        <text id="narr_ts3" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Both inputs pass through a shared backbone and feature enhancer to extract cross-modality representations.</tspan>
        </text>
        <text id="narr_ts4" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Next, the Contextual Attribute Density Generate Module computes attribute-specific density representations.</tspan>
        </text>
        <text id="narr_ts5" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Multi-scale visual features are extracted across four distinct resolution levels.</tspan>
        </text>
        <text id="narr_ts6" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Simultaneously, the corresponding text feature is extracted for the referring expression.</tspan>
        </text>
        <text id="narr_ts7" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">A linear projection layer maps the visual features into the text embedding space.</tspan>
        </text>
        <text id="narr_ts8" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The active text query is selected to align with the visual representations.</tspan>
        </text>
        <text id="narr_ts9" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Element-wise multiplication calculates the cross-modal similarity.</tspan>
        </text>
        <text id="narr_ts10" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">This produces similarity features highlighting regions relevant to the expression.</tspan>
        </text>
        <text id="narr_ts11" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The similarity and visual features are fed into a U-shape estimator to predict attribute density.</tspan>
        </text>
        <text id="narr_ts12" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The estimator outputs predicted contextual attribute density maps.</tspan>
        </text>
        <text id="narr_ts13" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Ground truth density maps provide direct contextual supervision.</tspan>
        </text>
        <text id="narr_ts14" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">A density loss optimizes the estimator to accurately capture attribute intensity.</tspan>
        </text>
        <text id="narr_ts15" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Intermediate representations from the estimator form multi-scale contextual attribute density features.</tspan>
        </text>
        <text id="narr_ts16" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">These features then enter the CAD Attention Module to enrich visual representations.</tspan>
        </text>
        <text id="narr_ts17" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The module first applies spatial attention to emphasize target foreground regions.</tspan>
        </text>
        <text id="narr_ts18" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The multi-scale density features serve as inputs to the spatial attention branch.</tspan>
        </text>
        <text id="narr_ts19" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Two-dimensional max pooling is performed across the channel dimension.</tspan>
        </text>
        <text id="narr_ts20" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Simultaneously, average pooling aggregates channel information.</tspan>
        </text>
        <text id="narr_ts21" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The pooled descriptors are concatenated along the channel axis.</tspan>
        </text>
        <text id="narr_ts22" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">A convolutional layer processes the combined feature maps.</tspan>
        </text>
        <text id="narr_ts23" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">A sigmoid activation produces the spatial attention map.</tspan>
        </text>
        <text id="narr_ts24" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Following spatial attention, channel attention is applied to enhance category discriminability.</tspan>
        </text>
        <text id="narr_ts25" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The primary visual features are brought into the channel attention block.</tspan>
        </text>
        <text id="narr_ts26" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">They are weighted by the spatial attention map to yield spatially attended features.</tspan>
        </text>
        <text id="narr_ts27" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Max pooling is computed across spatial dimensions.</tspan>
        </text>
        <text id="narr_ts28" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Average pooling also summarizes spatial statistics.</tspan>
        </text>
        <text id="narr_ts29" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Both vectors are processed through a shared multi-layer perceptron.</tspan>
        </text>
        <text id="narr_ts31" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The resulting channel features are merged via element-wise addition.</tspan>
        </text>
        <text id="narr_ts32" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">A sigmoid function generates the final channel attention weights.</tspan>
        </text>
        <text id="narr_ts33" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The channel weights modulate the spatially attended features.</tspan>
        </text>
        <text id="narr_ts34" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">This produces the final CAD-enhanced visual features.</tspan>
        </text>
        <text id="narr_ts35" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">In parallel, the CAD Dynamic Query Module initializes expressive object queries.</tspan>
        </text>
        <text id="narr_ts36" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The density initialization branch incorporates visual density priors.</tspan>
        </text>
        <text id="narr_ts37" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Multi-scale CAD features provide image-specific density cues.</tspan>
        </text>
        <text id="narr_ts38" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The top K density positions with highest similarity scores are selected.</tspan>
        </text>
        <text id="narr_ts39" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The text initialization branch constructs text-dynamic queries.</tspan>
        </text>
        <text id="narr_ts40" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The text feature vector is projected through linear and GELU activation layers.</tspan>
        </text>
        <text id="narr_ts43" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Initial query embeddings interact with the dynamic text representations.</tspan>
        </text>
        <text id="narr_ts44" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Matrix multiplication computes dynamic text weights across query tokens.</tspan>
        </text>
        <text id="narr_ts45" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">These weights re-modulate the text features into text-dynamic queries.</tspan>
        </text>
        <text id="narr_ts46" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Cross-attention fuses the text-dynamic queries with the top K density features.</tspan>
        </text>
        <text id="narr_ts47" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">This produces highly distinctive dynamic queries.</tspan>
        </text>
        <text id="narr_ts48" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The dynamic queries, CAD-enhanced visual features, and text features are gathered.</tspan>
        </text>
        <text id="narr_ts49" class="narr_txt" x="50%" y="355" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">They are fed into the cross-modality localization decoder</tspan>
            <tspan x="50%" dy="1.2em">to refine query positions layer by layer.</tspan>
        </text>
        <text id="narr_ts50" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">The decoder outputs bounding box predictions and counts for the referred objects.</tspan>
        </text>
        <text id="narr_ts51" class="narr_txt" x="50%" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#212529" text-anchor="middle">
            <tspan x="50%" dy="0">Finally, the model is trained end-to-end with the combined localization and density loss.</tspan>
        </text>
    </g>
