<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 560" width="100%" height="100%">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b4b8a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3d6824"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f2a679"/>
    </marker>
    <marker id="arrow-lightblue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7b9edb"/>
    </marker>

    <style>
      /* Base Ghost State */
      [data-id="group_legend"], [data-id="legend_text_1"], [data-id="legend_text_2"],
      [data-id="legend_text_3"], [data-id="legend_text_4"], [data-id="legend_arrow_1"],
      [data-id="legend_arrow_2"], [data-id="legend_arrow_3"], [data-id="legend_arrow_4"],
      #node_input_images, [data-id="node_input_images"], [data-id="label_input_images"],
      [data-id="edge_input_to_proxy"], #node_proxy_model, [data-id="node_proxy_model"],
      [data-id="label_proxy_model"], [data-id="symbol_plus"], [data-id="block_normal_segmentation"],
      [data-id="bg_normal_segmentation"], #node_normal_map, [data-id="node_normal_map"],
      [data-id="badge_normal_map"], #node_segmentation, [data-id="node_segmentation"],
      [data-id="badge_segmentation"], [data-id="edge_normalseg_to_shadow"],
      #node_shadow_treatment, [data-id="node_shadow_treatment"], [data-id="label_shadow_treatment"],
      [data-id="edge_shadow_to_refined"], #node_refined_model, [data-id="node_refined_model"],
      [data-id="label_refined_model"], [data-id="edge_normalseg_bottom_to_refined"],
      [data-id="edge_refined_to_denoised"], [data-id="block_denoised_albedo"],
      [data-id="bg_denoised_albedo"], #node_denoised_model, [data-id="node_denoised_model"],
      [data-id="label_denoised_model"], #node_albedo, [data-id="node_albedo"],
      [data-id="label_albedo"], [data-id="edge_bottom_to_albedo"] {
        opacity: 0.15;
        transition: opacity 0.2s ease;
      }

      /* Animation Bindings */
      [data-id="group_legend"], [data-id="legend_text_1"], [data-id="legend_text_2"],
      [data-id="legend_text_3"], [data-id="legend_text_4"], [data-id="legend_arrow_1"],
      [data-id="legend_arrow_2"], [data-id="legend_arrow_3"], [data-id="legend_arrow_4"],
      #node_input_images, [data-id="node_input_images"], [data-id="label_input_images"],
      [data-id="edge_input_to_proxy"] {
        animation: anim_ts1 25.5s infinite;
      }

      #node_proxy_model, [data-id="node_proxy_model"],
      [data-id="label_proxy_model"], [data-id="symbol_plus"] {
        animation: anim_ts2 25.5s infinite;
      }

      [data-id="block_normal_segmentation"], [data-id="bg_normal_segmentation"],
      #node_normal_map, [data-id="node_normal_map"], [data-id="badge_normal_map"],
      #node_segmentation, [data-id="node_segmentation"], [data-id="badge_segmentation"],
      [data-id="edge_normalseg_to_shadow"] {
        animation: anim_ts3 25.5s infinite;
      }

      #node_shadow_treatment, [data-id="node_shadow_treatment"],
      [data-id="label_shadow_treatment"], [data-id="edge_shadow_to_refined"] {
        animation: anim_ts4 25.5s infinite;
      }

      #node_refined_model, [data-id="node_refined_model"],
      [data-id="label_refined_model"], [data-id="edge_normalseg_bottom_to_refined"],
      [data-id="edge_refined_to_denoised"] {
        animation: anim_ts5 25.5s infinite;
      }

      [data-id="block_denoised_albedo"], [data-id="bg_denoised_albedo"],
      #node_denoised_model, [data-id="node_denoised_model"], [data-id="label_denoised_model"],
      #node_albedo, [data-id="node_albedo"], [data-id="label_albedo"],
      [data-id="edge_bottom_to_albedo"] {
        animation: anim_ts6 25.5s infinite;
      }

      /* Narration Subtitles */
      #narr_ts1 { animation: anim_narr_1 25.5s infinite; }
      #narr_ts2 { animation: anim_narr_2 25.5s infinite; }
      #narr_ts3 { animation: anim_narr_3 25.5s infinite; }
      #narr_ts4 { animation: anim_narr_4 25.5s infinite; }
      #narr_ts5 { animation: anim_narr_5 25.5s infinite; }
      #narr_ts6 { animation: anim_narr_6 25.5s infinite; }

      .narrative-text {
        opacity: 0;
        font-family: Arial, sans-serif;
        font-size: 20px;
        font-weight: bold;
        fill: #1a202c;
      }

      /* Step Keyframes (16.666% each) */
      @keyframes anim_ts1 {
        0%       { opacity: 1.0; }
        16.666%  { opacity: 1.0; }
        16.667%  { opacity: 0.15; }
        100%     { opacity: 0.15; }
      }

      @keyframes anim_ts2 {
        0%, 16.666%     { opacity: 0.15; }
        16.667%, 33.333% { opacity: 1.0; }
        33.334%, 100%    { opacity: 0.15; }
      }

      @keyframes anim_ts3 {
        0%, 33.333%     { opacity: 0.15; }
        33.334%, 50.000% { opacity: 1.0; }
        50.001%, 100%    { opacity: 0.15; }
      }

      @keyframes anim_ts4 {
        0%, 50.000%     { opacity: 0.15; }
        50.001%, 66.666% { opacity: 1.0; }
        66.667%, 100%    { opacity: 0.15; }
      }

      @keyframes anim_ts5 {
        0%, 66.666%     { opacity: 0.15; }
        66.667%, 83.333% { opacity: 1.0; }
        83.334%, 100%    { opacity: 0.15; }
      }

      @keyframes anim_ts6 {
        0%, 83.333%     { opacity: 0.15; }
        83.334%, 100%   { opacity: 1.0; }
      }

      /* Narration Keyframes */
      @keyframes anim_narr_1 {
        0%, 16.666%     { opacity: 1.0; }
        16.667%, 100%   { opacity: 0; }
      }

      @keyframes anim_narr_2 {
        0%, 16.666%     { opacity: 0; }
        16.667%, 33.333% { opacity: 1.0; }
        33.334%, 100%   { opacity: 0; }
      }

      @keyframes anim_narr_3 {
        0%, 33.333%     { opacity: 0; }
        33.334%, 50.000% { opacity: 1.0; }
        50.001%, 100%   { opacity: 0; }
      }

      @keyframes anim_narr_4 {
        0%, 50.000%     { opacity: 0; }
        50.001%, 66.666% { opacity: 1.0; }
        66.667%, 100%   { opacity: 0; }
      }

      @keyframes anim_narr_5 {
        0%, 66.666%     { opacity: 0; }
        66.667%, 83.333% { opacity: 1.0; }
        83.334%, 100%   { opacity: 0; }
      }

      @keyframes anim_narr_6 {
        0%, 83.333%     { opacity: 0; }
        83.334%, 100%   { opacity: 1.0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ================= LEGEND ================= -->
  <g data-id="group_legend" data-class="block" data-parent="root">
    <!-- 3D morphable model -->
    <line data-id="legend_arrow_1" data-class="edge" data-source="group_legend" data-target="legend_text_1" x1="720" y1="20" x2="745" y2="20" stroke="#1b4b8a" stroke-width="6" marker-end="url(#arrow-blue)"/>
    <text data-id="legend_text_1" data-class="text_node" data-parent="group_legend" x="755" y="27" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#000000">3D morphable model</text>

    <!-- Shadow Processing -->
    <line data-id="legend_arrow_2" data-class="edge" data-source="group_legend" data-target="legend_text_2" x1="720" y1="65" x2="745" y2="65" stroke="#3d6824" stroke-width="6" marker-end="url(#arrow-green)"/>
    <text data-id="legend_text_2" data-class="text_node" data-parent="group_legend" x="755" y="72" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#000000">Shadow Processing</text>

    <!-- Light Calibration / Photometric Stereo -->
    <line data-id="legend_arrow_3" data-class="edge" data-source="group_legend" data-target="legend_text_3" x1="1105" y1="20" x2="1130" y2="20" stroke="#f2a679" stroke-width="6" marker-end="url(#arrow-orange)"/>
    <text data-id="legend_text_3" data-class="text_node" data-parent="group_legend" x="1140" y="27" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#000000">Light Calibration / Photometric Stereo</text>

    <!-- Denoising -->
    <line data-id="legend_arrow_4" data-class="edge" data-source="group_legend" data-target="legend_text_4" x1="1105" y1="65" x2="1130" y2="65" stroke="#7b9edb" stroke-width="6" marker-end="url(#arrow-lightblue)"/>
    <text data-id="legend_text_4" data-class="text_node" data-parent="group_legend" x="1140" y="72" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#000000">Denoising</text>
  </g>

  <!-- ================= PIPELINE BLOCKS & NODES ================= -->

  <!-- 1. Input Images -->
  <g id="node_input_images" data-id="node_input_images" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_input_images.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_input_images.png" x="10" y="120" width="170" height="190" preserveAspectRatio="xMidYMid meet" /></g>
  <text data-id="label_input_images" data-class="text_node" data-parent="root" x="95" y="348" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">
    <tspan x="95" dy="0">Input</tspan>
    <tspan x="95" dy="28">Images</tspan>
  </text>

  <!-- 2. Proxy Model -->
  <g id="node_proxy_model" data-id="node_proxy_model" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_proxy_model.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_proxy_model.png" x="255" y="120" width="160" height="190" preserveAspectRatio="xMidYMid meet" /></g>
  <text data-id="label_proxy_model" data-class="text_node" data-parent="root" x="335" y="348" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">
    <tspan x="335" dy="0">Proxy</tspan>
    <tspan x="335" dy="28">Model</tspan>
  </text>

  <!-- Plus Sign -->
  <text data-id="symbol_plus" data-class="text_node" data-parent="root" x="435" y="223" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#000000">+</text>

  <!-- 3. Normal Map & Segmentation Container -->
  <g data-id="block_normal_segmentation" data-class="block" data-parent="root">
    <!-- Outer Peach Rounded Container with dashed border -->
    <rect data-id="bg_normal_segmentation" data-class="child_node" data-parent="block_normal_segmentation" x="460" y="30" width="240" height="445" rx="25" ry="25" fill="#f9d6be" stroke="#f2a679" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Normal Map dashed boundary box -->
    <rect x="475" y="40" width="210" height="200" rx="6" ry="6" fill="none" stroke="#3b7431" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Top Section: Normal Map -->
    <g id="node_normal_map" data-id="node_normal_map" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_normal_map.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_normal_map.png" x="480" y="48" width="200" height="195" preserveAspectRatio="xMidYMid meet" /></g>
    <!-- Normal Map Header Badge -->
    <g data-id="badge_normal_map" data-class="child_node" data-parent="block_normal_segmentation">
      <rect x="495" y="36" width="170" height="26" rx="4" ry="4" fill="#3b7431"/>
      <text x="580" y="55" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Normal Map</text>
    </g>

    <!-- Segmentation dashed boundary box -->
    <rect x="475" y="250" width="210" height="215" rx="6" ry="6" fill="none" stroke="#5b9bd5" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Bottom Section: Segmentation -->
    <g id="node_segmentation" data-id="node_segmentation" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_segmentation.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_segmentation.png" x="480" y="258" width="200" height="205" preserveAspectRatio="xMidYMid meet" /></g>
    <!-- Segmentation Header Badge -->
    <g data-id="badge_segmentation" data-class="child_node" data-parent="block_normal_segmentation">
      <rect x="495" y="246" width="170" height="26" rx="4" ry="4" fill="#5b9bd5"/>
      <text x="580" y="265" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Segmentation</text>
    </g>
  </g>

  <!-- 4. Shadow Treatment -->
  <g id="node_shadow_treatment" data-id="node_shadow_treatment" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_shadow_treatment.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_shadow_treatment.png" x="775" y="120" width="180" height="190" preserveAspectRatio="xMidYMid meet" /></g>
  <text data-id="label_shadow_treatment" data-class="text_node" data-parent="root" x="865" y="348" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">
    <tspan x="865" dy="0">Shadow</tspan>
    <tspan x="865" dy="28">Treatment</tspan>
  </text>

  <!-- 5. Refined Model -->
  <g id="node_refined_model" data-id="node_refined_model" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_refined_model.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_refined_model.png" x="1015" y="100" width="170" height="215" preserveAspectRatio="xMidYMid meet" /></g>
  <text data-id="label_refined_model" data-class="text_node" data-parent="root" x="1100" y="348" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">
    <tspan x="1100" dy="0">Refined</tspan>
    <tspan x="1100" dy="28">Model</tspan>
  </text>

  <!-- 6. Denoised & Albedo Container -->
  <g data-id="block_denoised_albedo" data-class="block" data-parent="root">
    <!-- Blue Rounded Container -->
    <rect data-id="bg_denoised_albedo" data-class="child_node" data-parent="block_denoised_albedo" x="1235" y="85" width="460" height="300" rx="40" ry="40" fill="#a4c2eb"/>

    <!-- Denoised Model -->
    <g id="node_denoised_model" data-id="node_denoised_model" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_denoised_model.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_denoised_model.png" x="1255" y="95" width="170" height="225" preserveAspectRatio="xMidYMid meet" /></g>
    <text data-id="label_denoised_model" data-class="text_node" data-parent="block_denoised_albedo" x="1340" y="348" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">
      <tspan x="1340" dy="0">Denoised</tspan>
      <tspan x="1340" dy="28">Model</tspan>
    </text>

    <!-- Albedo -->
    <g id="node_albedo" data-id="node_albedo" data-class="raster_node"><image href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_albedo.png" xlink:href="../../rasters/Paper2Fig_pipe_diff_000000130/crop_node_albedo.png" x="1455" y="95" width="220" height="225" preserveAspectRatio="xMidYMid meet" /></g>
    <text data-id="label_albedo" data-class="text_node" data-parent="block_denoised_albedo" x="1565" y="358" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">Albedo</text>
  </g>

  <!-- ================= EDGES & CONNECTIONS ================= -->

  <!-- Arrow 1: Input Images -> Proxy Model (Blue) -->
  <line data-id="edge_input_to_proxy" data-class="edge" data-source="node_input_images" data-target="node_proxy_model" x1="195" y1="215" x2="245" y2="215" stroke="#1b4b8a" stroke-width="10" marker-end="url(#arrow-blue)"/>

  <!-- Arrow 2: Normal/Segmentation Block -> Shadow Treatment (Green) -->
  <line data-id="edge_normalseg_to_shadow" data-class="edge" data-source="block_normal_segmentation" data-target="node_shadow_treatment" x1="712" y1="210" x2="762" y2="210" stroke="#3d6824" stroke-width="10" marker-end="url(#arrow-green)"/>

  <!-- Arrow 3: Shadow Treatment -> Refined Model (Orange) -->
  <line data-id="edge_shadow_to_refined" data-class="edge" data-source="node_shadow_treatment" data-target="node_refined_model" x1="965" y1="215" x2="1005" y2="215" stroke="#f2a679" stroke-width="10" marker-end="url(#arrow-orange)"/>

  <!-- Arrow 4: Refined Model -> Denoised/Albedo Block (Light Blue) -->
  <line data-id="edge_refined_to_denoised" data-class="edge" data-source="node_refined_model" data-target="block_denoised_albedo" x1="1190" y1="215" x2="1230" y2="215" stroke="#7b9edb" stroke-width="10" marker-end="url(#arrow-lightblue)"/>

  <!-- Arrow 5: Normal/Segmentation Block (Bottom) -> Refined Model (Orange Curved / Orthogonal) -->
  <path data-id="edge_normalseg_bottom_to_refined" data-class="edge" data-source="block_normal_segmentation" data-target="node_refined_model" d="M 710 445 L 1075 445 Q 1090 445 1090 430 L 1090 380" fill="none" stroke="#f2a679" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow-orange)"/>

  <!-- Arrow 6: Bottom Path Extension -> Albedo / Denoised Block (Light Blue Curved / Orthogonal) -->
  <path data-id="edge_bottom_to_albedo" data-class="edge" data-source="block_normal_segmentation" data-target="block_denoised_albedo" d="M 1090 445 L 1455 445 Q 1470 445 1470 430 L 1470 395" fill="none" stroke="#7b9edb" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow-lightblue)"/>

  <!-- ================= NARRATION BANNER ================= -->
  <g id="narration_banner">
    <text id="narr_ts1" class="narrative-text" x="50%" y="525" text-anchor="middle">
      <tspan x="50%" dy="0">The pipeline begins with input face images captured under varying illumination,</tspan>
      <tspan x="50%" dy="1.25em">guided by key stages outlined in the legend.</tspan>
    </text>
    <text id="narr_ts2" class="narrative-text" x="50%" y="535" text-anchor="middle">
      <tspan x="50%" dy="0">A three-dimensional morphable model is first fitted to the input to construct a baseline geometric proxy.</tspan>
    </text>
    <text id="narr_ts3" class="narrative-text" x="50%" y="525" text-anchor="middle">
      <tspan x="50%" dy="0">From this proxy, a surface normal map and semantic segmentation are extracted</tspan>
      <tspan x="50%" dy="1.25em">to distinguish regions such as bare skin and hair.</tspan>
    </text>
    <text id="narr_ts4" class="narrative-text" x="50%" y="535" text-anchor="middle">
      <tspan x="50%" dy="0">Next, shadow processing handles shaded areas across the face to isolate reliable photometric information.</tspan>
    </text>
    <text id="narr_ts5" class="narrative-text" x="50%" y="525" text-anchor="middle">
      <tspan x="50%" dy="0">Using light calibration and photometric stereo, the system combines the shadow analysis</tspan>
      <tspan x="50%" dy="1.25em">and proxy guidance into a refined geometric model.</tspan>
    </text>
    <text id="narr_ts6" class="narrative-text" x="50%" y="525" text-anchor="middle">
      <tspan x="50%" dy="0">Finally, a denoising step produces the detailed final three-dimensional face mesh</tspan>
      <tspan x="50%" dy="1.25em">along with the recovered surface albedo.</tspan>
    </text>
  </g>
</svg>