        <text id="narr_ts1" class="narr-text" x="50%" y="394">Within the MCP Tool Collection, the pipeline identifies the Correct Tools labeled G.</text>
        <text id="narr_ts2" class="narr-text" x="50%" y="394">Alongside these, Distractor Tools labeled F are introduced.</text>
        <text id="narr_ts3" class="narr-text" x="50%" y="386">
            <tspan x="50%" dy="0">Together, they are merged into the Candidate Tool List L containing K tools,</tspan>
            <tspan x="50%" dy="1.2em">which is provided to the sandbox.</tspan>
        </text>
        <text id="narr_ts4" class="narr-text" x="50%" y="394">In parallel, the Task Set supplies Real-world Tasks into the environment.</text>
        <text id="narr_ts5" class="narr-text" x="50%" y="394">These inputs enter the AutoGen-based Sandbox.</text>
        <text id="narr_ts6" class="narr-text" x="50%" y="394">The sandbox handles Dynamic MCP Tool Loading,</text>
        <text id="narr_ts7" class="narr-text" x="50%" y="394">runs Local MCP Servers,</text>
        <text id="narr_ts8" class="narr-text" x="50%" y="394">and maintains Stable and Reproducible Execution.</text>
        <text id="narr_ts9" class="narr-text" x="50%" y="386">
            <tspan x="50%" dy="0">The sandbox exchanges tool calls and execution feedback</tspan>
            <tspan x="50%" dy="1.2em">with the LLM-based Agent.</tspan>
        </text>
        <text id="narr_ts10" class="narr-text" x="50%" y="394">The agent pipeline begins with Task Understanding,</text>
        <text id="narr_ts11" class="narr-text" x="50%" y="394">proceeds through Tool Selection,</text>
        <text id="narr_ts12" class="narr-text" x="50%" y="394">and concludes with Parameter Generation.</text>
        <text id="narr_ts13" class="narr-text" x="50%" y="394">Finally, the workflow routes results to the Evaluation and Scoring module.</text>
        <text id="narr_ts14" class="narr-text" x="50%" y="394">Evaluation is broken down into Correct Tool Selection,</text>
        <text id="narr_ts15" class="narr-text" x="50%" y="394">Anti-interference Robustness,</text>
        <text id="narr_ts16" class="narr-text" x="50%" y="394">Task Completion,</text>
        <text id="narr_ts17" class="narr-text" x="50%" y="394">and Efficiency Metrics.</text>
