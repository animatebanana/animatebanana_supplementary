<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 315" width="485" height="315">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#000000" />
    </marker>
    <style>
      #block_input, #input_face_1, #input_face_2, #input_dots, #input_face_3, #label_few_inputs, #label_few_inputs_sub, #edge_input_to_encoder,
      #encoder_node, #edge_encoder_to_omni_id,
      #omni_id_group, #label_omni_id, #edge_omni_to_decoder1, #edge_omni_to_decoder2, #edge_omni_to_decoderk,
      #decoder_1, #decoder_2, #decoder_dots, #decoder_k, #edge_decoder1_to_outputs, #edge_decoder2_to_outputs, #edge_decoderk_to_outputs,
      #block_output, #output_face_1, #output_face_2, #output_face_3, #output_face_4, #output_face_5, #output_face_6, #output_face_7, #output_face_8, #label_many_outputs,
      #edge_output_to_input_feedback {
        filter: grayscale(100%) opacity(0.4);
        animation-name: colorPop;
        animation-duration: 0.5s;
        animation-fill-mode: forwards;
      }

      @keyframes colorPop {
        to {
          filter: grayscale(0%) opacity(1);
        }
      }

      /* Timestamp Delays */
      #block_input, #input_face_1, #input_face_2, #input_dots, #input_face_3, #label_few_inputs, #label_few_inputs_sub, #edge_input_to_encoder {
        animation-delay: 0.5s;
      }

      #encoder_node, #edge_encoder_to_omni_id {
        animation-delay: 1.0s;
      }

      #omni_id_group, #label_omni_id, #edge_omni_to_decoder1, #edge_omni_to_decoder2, #edge_omni_to_decoderk {
        animation-delay: 1.5s;
      }

      #decoder_1, #decoder_2, #decoder_dots, #decoder_k, #edge_decoder1_to_outputs, #edge_decoder2_to_outputs, #edge_decoderk_to_outputs {
        animation-delay: 2.0s;
      }

      #block_output, #output_face_1, #output_face_2, #output_face_3, #output_face_4, #output_face_5, #output_face_6, #output_face_7, #output_face_8, #label_many_outputs {
        animation-delay: 2.5s;
      }

      #edge_output_to_input_feedback {
        animation-delay: 3.0s;
      }

      /* Narration Banner Animations */
      .narr-text {
        opacity: 0;
        animation-fill-mode: forwards;
      }

      #narr_ts1 {
        animation: showStep1 0.5s linear 0.5s forwards;
      }
      #narr_ts2 {
        animation: showStep2 0.5s linear 1.0s forwards;
      }
      #narr_ts3 {
        animation: showStep3 0.5s linear 1.5s forwards;
      }
      #narr_ts4 {
        animation: showStep4 0.5s linear 2.0s forwards;
      }
      #narr_ts5 {
        animation: showStep5 0.5s linear 2.5s forwards;
      }
      #narr_ts6 {
        animation: showStepFinal 0.5s linear 3.0s forwards;
      }

      @keyframes showStep1 {
        0% { opacity: 0; }
        10% { opacity: 1; }
        99% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes showStep2 {
        0% { opacity: 0; }
        10% { opacity: 1; }
        99% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes showStep3 {
        0% { opacity: 0; }
        10% { opacity: 1; }
        99% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes showStep4 {
        0% { opacity: 0; }
        10% { opacity: 1; }
        99% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes showStep5 {
        0% { opacity: 0; }
        10% { opacity: 1; }
        99% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes showStepFinal {
        0% { opacity: 0; }
        10% { opacity: 1; }
        100% { opacity: 1; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- BACKGROUND BLOCKS -->
  <!-- Input Container Block -->
  <g id="block_input" data-id="block_input" data-class="block" data-parent="root">
    <rect id="input_container_rect" x="301" y="4" width="170" height="40" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" />
    
    <g id="input_face_1" data-id="input_face_1" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_input_face_1.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_input_face_1.png" x="306" y="7" width="34" height="34" preserveAspectRatio="xMidYMid meet" /></g>

    <g id="input_face_2" data-id="input_face_2" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_input_face_2.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_input_face_2.png" x="348" y="7" width="34" height="34" preserveAspectRatio="xMidYMid meet" /></g>

    <text id="input_dots" data-id="input_dots" data-class="child_node" data-parent="block_input" x="398" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">...</text>

    <g id="input_face_3" data-id="input_face_3" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_input_face_3.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_input_face_3.png" x="427" y="7" width="34" height="34" preserveAspectRatio="xMidYMid meet" /></g>
  </g>

  <!-- Output Container Block -->
  <g id="block_output" data-id="block_output" data-class="block" data-parent="root">
    <rect id="output_container_rect" x="4" y="177" width="477" height="58" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
    
    <g id="output_face_1" data-id="output_face_1" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_output_face_1.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_output_face_1.png" x="13" y="183" width="52" height="46" preserveAspectRatio="xMidYMid meet" /></g>

    <g id="output_face_2" data-id="output_face_2" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_output_face_2.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_output_face_2.png" x="71" y="183" width="52" height="46" preserveAspectRatio="xMidYMid meet" /></g>

    <g id="output_face_3" data-id="output_face_3" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_output_face_3.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_output_face_3.png" x="129" y="183" width="52" height="46" preserveAspectRatio="xMidYMid meet" /></g>

    <g id="output_face_4" data-id="output_face_4" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_output_face_4.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_output_face_4.png" x="187" y="183" width="52" height="46" preserveAspectRatio="xMidYMid meet" /></g>

    <g id="output_face_5" data-id="output_face_5" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_output_face_5.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_output_face_5.png" x="245" y="183" width="52" height="46" preserveAspectRatio="xMidYMid meet" /></g>

    <g id="output_face_6" data-id="output_face_6" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_output_face_6.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_output_face_6.png" x="303" y="183" width="52" height="46" preserveAspectRatio="xMidYMid meet" /></g>

    <g id="output_face_7" data-id="output_face_7" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_output_face_7.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_output_face_7.png" x="361" y="183" width="52" height="46" preserveAspectRatio="xMidYMid meet" /></g>

    <g id="output_face_8" data-id="output_face_8" data-class="raster_node"><image href="../../rasters/CVPR_2025_arch02021/crop_output_face_8.png" xlink:href="../../rasters/CVPR_2025_arch02021/crop_output_face_8.png" x="419" y="183" width="52" height="46" preserveAspectRatio="xMidYMid meet" /></g>
  </g>

  <!-- STANDALONE NODES & COMPOSITE WHOLES -->
  <!-- Omni-ID Encoder Node -->
  <g id="encoder_node" data-id="encoder_node" data-class="standalone_node" data-parent="root">
    <rect x="72" y="6" width="192" height="36" rx="6" fill="#ff8577" />
    <text x="168" y="29" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Omni-ID Encoder</text>
  </g>

  <!-- Omni-ID Composite Vector Node -->
  <g id="omni_id_group" data-id="omni_id_group" data-class="composite_whole" data-parent="root">
    <rect id="omni_id_bg" data-id="omni_id_bg" data-class="composite_part" data-parent="omni_id_group" x="125" y="62" width="87" height="25" rx="6" fill="#f4f4f4" stroke="#7f8c8d" stroke-width="1.5" />
    <rect id="omni_id_slot1" data-id="omni_id_slot1" data-class="composite_part" data-parent="omni_id_group" x="133" y="67" width="15" height="15" rx="2" fill="#48bb78" stroke="#276749" stroke-width="1" />
    <rect id="omni_id_slot2" data-id="omni_id_slot2" data-class="composite_part" data-parent="omni_id_group" x="152" y="67" width="15" height="15" rx="2" fill="#4299e1" stroke="#2b6cb0" stroke-width="1" />
    <rect id="omni_id_slot3" data-id="omni_id_slot3" data-class="composite_part" data-parent="omni_id_group" x="171" y="67" width="15" height="15" rx="2" fill="#f56565" stroke="#9b2c2c" stroke-width="1" />
    <rect id="omni_id_slot4" data-id="omni_id_slot4" data-class="composite_part" data-parent="omni_id_group" x="190" y="67" width="15" height="15" rx="2" fill="#fefcbf" stroke="#b7791f" stroke-width="1" />
  </g>

  <!-- Decoders -->
  <g id="decoder_1" data-id="decoder_1" data-class="standalone_node" data-parent="root">
    <rect x="68" y="112" width="84" height="36" rx="6" fill="#54bfff" />
    <text x="110" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Decoder 1</text>
  </g>

  <g id="decoder_2" data-id="decoder_2" data-class="standalone_node" data-parent="root">
    <rect x="159" y="112" width="84" height="36" rx="6" fill="#54bfff" />
    <text x="201" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Decoder 2</text>
  </g>

  <text id="decoder_dots" data-id="decoder_dots" data-class="standalone_node" data-parent="root" x="280" y="134" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">...</text>

  <g id="decoder_k" data-id="decoder_k" data-class="standalone_node" data-parent="root">
    <rect x="316" y="112" width="84" height="36" rx="6" fill="#54bfff" />
    <text x="358" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Decoder K</text>
  </g>

  <!-- TEXT NODES (DECORATIVE / LABELS) -->
  <text id="label_omni_id" data-id="label_omni_id" data-class="text_node" data-parent="root" x="88" y="79" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Omni-ID</text>
  
  <text id="label_few_inputs" data-id="label_few_inputs" data-class="text_node" data-parent="root" x="352" y="58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Few Inputs</text>
  <text id="label_few_inputs_sub" data-id="label_few_inputs_sub" data-class="text_node" data-parent="root" x="352" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">(varied number)</text>

  <text id="label_many_outputs" data-id="label_many_outputs" data-class="text_node" data-parent="root" x="54" y="166" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Many Outputs</text>

  <!-- EDGES -->
  <!-- Input Container to Encoder -->
  <line id="edge_input_to_encoder" data-id="edge_input_to_encoder" data-class="edge" data-source="block_input" data-target="encoder_node" x1="301" y1="24" x2="270" y2="24" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Encoder to Omni-ID -->
  <line id="edge_encoder_to_omni_id" data-id="edge_encoder_to_omni_id" data-class="edge" data-source="encoder_node" data-target="omni_id_group" x1="168" y1="42" x2="168" y2="56" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Omni-ID branching to Decoder 1 -->
  <path id="edge_omni_to_decoder1" data-id="edge_omni_to_decoder1" data-class="edge" data-source="omni_id_group" data-target="decoder_1" d="M 168 87 L 168 99 L 110 99 L 110 106" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Omni-ID branching to Decoder 2 -->
  <path id="edge_omni_to_decoder2" data-id="edge_omni_to_decoder2" data-class="edge" data-source="omni_id_group" data-target="decoder_2" d="M 168 87 L 168 99 L 201 99 L 201 106" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Omni-ID branching to Decoder K -->
  <path id="edge_omni_to_decoderk" data-id="edge_omni_to_decoderk" data-class="edge" data-source="omni_id_group" data-target="decoder_k" d="M 168 87 L 168 99 L 358 99 L 358 106" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decoder 1 to Outputs -->
  <line id="edge_decoder1_to_outputs" data-id="edge_decoder1_to_outputs" data-class="edge" data-source="decoder_1" data-target="block_output" x1="110" y1="148" x2="110" y2="171" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decoder 2 to Outputs -->
  <line id="edge_decoder2_to_outputs" data-id="edge_decoder2_to_outputs" data-class="edge" data-source="decoder_2" data-target="block_output" x1="201" y1="148" x2="201" y2="171" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decoder K to Outputs -->
  <line id="edge_decoderk_to_outputs" data-id="edge_decoderk_to_outputs" data-class="edge" data-source="decoder_k" data-target="block_output" x1="358" y1="148" x2="358" y2="171" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Output back to Input (Dashed vertical line) -->
  <line id="edge_output_to_input_feedback" data-id="edge_output_to_input_feedback" data-class="edge" data-source="block_output" data-target="block_input" x1="420" y1="177" x2="420" y2="50" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />

  <!-- NARRATION BANNER -->
  <g id="narration_banner">
    <rect x="10" y="248" width="465" height="58" rx="6" fill="#f8f9fa" stroke="#e2e8f0" stroke-width="1" />
    <text id="narr_ts1" class="narr-text" x="50%" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2d3748">
      <tspan x="50%" dy="0">The pipeline begins by taking a limited set containing a varied number</tspan>
      <tspan x="50%" dy="1.3em">of input face images of an individual across different poses and expressions.</tspan>
    </text>
    <text id="narr_ts2" class="narr-text" x="50%" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2d3748">
      <tspan x="50%" dy="0">These images are fed into the Omni-ID Encoder, which integrates the image</tspan>
      <tspan x="50%" dy="1.3em">set features using cross-attention and self-attention mechanisms.</tspan>
    </text>
    <text id="narr_ts3" class="narr-text" x="50%" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2d3748">
      <tspan x="50%" dy="0">The encoder outputs Omni-ID, a fixed-size structured representation</tspan>
      <tspan x="50%" dy="1.3em">that consolidates holistic identity information across views.</tspan>
    </text>
    <text id="narr_ts4" class="narr-text" x="50%" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2d3748">
      <tspan x="50%" dy="0">During training, this representation conditions a bank of multiple decoders,</tspan>
      <tspan x="50%" dy="1.3em">combining complementary objectives such as masked reconstruction and flow matching.</tspan>
    </text>
    <text id="narr_ts5" class="narr-text" x="50%" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2d3748">
      <tspan x="50%" dy="0">Through this few-to-many reconstruction task, decoders generate numerous target</tspan>
      <tspan x="50%" dy="1.3em">face images covering diverse poses and expressions while preserving identity.</tspan>
    </text>
    <text id="narr_ts6" class="narr-text" x="50%" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2d3748">
      <tspan x="50%" dy="0">The input images are sampled directly from the broader target identity set,</tspan>
      <tspan x="50%" dy="1.3em">closing the loop on the few-to-many training strategy.</tspan>
    </text>
  </g>
</svg>