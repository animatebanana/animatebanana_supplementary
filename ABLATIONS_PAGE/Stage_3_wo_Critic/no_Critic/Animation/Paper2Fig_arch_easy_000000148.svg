<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>

    <style>
      /* Base ghosting state */
      #node_bots_response,
      #edge_bot_to_container,
      #block_main_container,
      #rect_main_container,
      #edge_fork_network,
      #edge_fork_repetition,
      #edge_fork_question,
      #edge_fork_short_safe,
      #node_next_sentence,
      #block_repetition,
      #rect_repetition_bg,
      #text_repetition_title,
      #rect_repetition_inner_dash,
      #edge_repetition_spine,
      #node_rep_internal,
      #node_rep_external,
      #node_rep_partner,
      #node_question_asking,
      #node_short_safe,
      #edge_next_sentence_to_classifier,
      #edge_repetition_to_classifier,
      #edge_question_to_classifier,
      #edge_short_safe_to_classifier,
      #node_classifier,
      #edge_classifier_to_boundary,
      #edge_container_to_response_class,
      #node_response_classification {
        opacity: 0.15;
        animation-duration: 25s;
        animation-iteration-count: infinite;
        animation-timing-function: step-start;
      }

      /* Animation keyframe bindings */
      #node_bots_response,
      #edge_bot_to_container {
        animation-name: anim_t1;
      }

      #block_main_container,
      #rect_main_container {
        animation-name: anim_main_container;
      }

      #edge_fork_network,
      #edge_fork_repetition,
      #edge_fork_question,
      #edge_fork_short_safe {
        animation-name: anim_t2;
      }

      #node_next_sentence {
        animation-name: anim_t3;
      }

      #block_repetition,
      #rect_repetition_bg,
      #text_repetition_title {
        animation-name: anim_repetition_parent;
      }

      #rect_repetition_inner_dash,
      #edge_repetition_spine,
      #node_rep_internal,
      #node_rep_external,
      #node_rep_partner {
        animation-name: anim_t5;
      }

      #node_question_asking {
        animation-name: anim_t6;
      }

      #node_short_safe {
        animation-name: anim_t7;
      }

      #edge_next_sentence_to_classifier,
      #edge_repetition_to_classifier,
      #edge_question_to_classifier,
      #edge_short_safe_to_classifier {
        animation-name: anim_t8;
      }

      #node_classifier,
      #edge_classifier_to_boundary {
        animation-name: anim_t9;
      }

      #edge_container_to_response_class,
      #node_response_classification {
        animation-name: anim_t10;
      }

      /* Narration styles */
      .narrative-text {
        font-family: Arial, sans-serif;
        font-size: 16px;
        fill: #222222;
        text-anchor: middle;
        opacity: 0;
        animation-duration: 25s;
        animation-iteration-count: infinite;
        animation-timing-function: step-start;
      }

      #narr_t1 { animation-name: anim_narr_1; }
      #narr_t2 { animation-name: anim_narr_2; }
      #narr_t3 { animation-name: anim_narr_3; }
      #narr_t4 { animation-name: anim_narr_4; }
      #narr_t5 { animation-name: anim_narr_5; }
      #narr_t6 { animation-name: anim_narr_6; }
      #narr_t7 { animation-name: anim_narr_7; }
      #narr_t8 { animation-name: anim_narr_8; }
      #narr_t9 { animation-name: anim_narr_9; }
      #narr_t10 { animation-name: anim_narr_10; }

      /* Element Keyframes */
      @keyframes anim_t1 {
        0% { opacity: 1; }
        10% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_main_container {
        0% { opacity: 0.15; }
        10% { opacity: 1; }
        90% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t2 {
        0% { opacity: 0.15; }
        10% { opacity: 1; }
        20% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t3 {
        0% { opacity: 0.15; }
        20% { opacity: 1; }
        30% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_repetition_parent {
        0% { opacity: 0.15; }
        30% { opacity: 1; }
        50% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t5 {
        0% { opacity: 0.15; }
        40% { opacity: 1; }
        50% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t6 {
        0% { opacity: 0.15; }
        50% { opacity: 1; }
        60% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t7 {
        0% { opacity: 0.15; }
        60% { opacity: 1; }
        70% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t8 {
        0% { opacity: 0.15; }
        70% { opacity: 1; }
        80% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t9 {
        0% { opacity: 0.15; }
        80% { opacity: 1; }
        90% { opacity: 0.15; }
        100% { opacity: 0.15; }
      }

      @keyframes anim_t10 {
        0% { opacity: 0.15; }
        90% { opacity: 1; }
        100% { opacity: 1; }
      }

      /* Narration Keyframes */
      @keyframes anim_narr_1 {
        0% { opacity: 1; }
        10% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_2 {
        0% { opacity: 0; }
        10% { opacity: 1; }
        20% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_3 {
        0% { opacity: 0; }
        20% { opacity: 1; }
        30% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_4 {
        0% { opacity: 0; }
        30% { opacity: 1; }
        40% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_5 {
        0% { opacity: 0; }
        40% { opacity: 1; }
        50% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_6 {
        0% { opacity: 0; }
        50% { opacity: 1; }
        60% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_7 {
        0% { opacity: 0; }
        60% { opacity: 1; }
        70% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_8 {
        0% { opacity: 0; }
        70% { opacity: 1; }
        80% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_9 {
        0% { opacity: 0; }
        80% { opacity: 1; }
        90% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes anim_narr_10 {
        0% { opacity: 0; }
        90% { opacity: 1; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Top Standalone Node: Bot's Response -->
  <g id="node_bots_response" data-id="node_bots_response" data-class="standalone_node" data-parent="root">
    <rect x="375" y="2" width="240" height="78" rx="39" fill="#ADC2D5" stroke="#2B4660" stroke-width="2"/>
    <text x="495" y="47" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#000000">Bot's Response</text>
  </g>

  <!-- Edge: Bot's Response to Main Container -->
  <path id="edge_bot_to_container" data-id="edge_bot_to_container" data-class="edge" data-source="node_bots_response" data-target="block_main_container" d="M 495 80 L 495 133" stroke="#000000" stroke-width="2" marker-end="url(#arrow-solid)"/>

  <!-- Main Processing Block Container -->
  <g id="block_main_container" data-id="block_main_container" data-class="block" data-parent="root">
    <rect id="rect_main_container" data-id="rect_main_container" data-class="child_node" data-parent="block_main_container" x="2" y="134" width="996" height="616" rx="60" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

    <!-- Internal Routing Edges from top of container to 4 modules -->
    <path id="edge_fork_network" data-id="edge_fork_network" data-class="edge" data-source="rect_main_container" data-target="node_next_sentence" d="M 496 134 L 496 193 M 172 193 L 830 193 M 172 193 L 172 269" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)" fill="none"/>
    <path id="edge_fork_repetition" data-id="edge_fork_repetition" data-class="edge" data-source="rect_main_container" data-target="block_repetition" d="M 391 193 L 391 269" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)" fill="none"/>
    <path id="edge_fork_question" data-id="edge_fork_question" data-class="edge" data-source="rect_main_container" data-target="node_question_asking" d="M 611 193 L 611 269" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)" fill="none"/>
    <path id="edge_fork_short_safe" data-id="edge_fork_short_safe" data-class="edge" data-source="rect_main_container" data-target="node_short_safe" d="M 830 193 L 830 269" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)" fill="none"/>

    <!-- Module 1: Next Sentence Prediction -->
    <g id="node_next_sentence" data-id="node_next_sentence" data-class="child_node" data-parent="block_main_container">
      <rect x="94" y="271" width="149" height="270" rx="25" fill="#CCE5C9" stroke="#5E9F61" stroke-width="2"/>
      <text x="168.5" y="388" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#000000">
        <tspan x="168.5" dy="0">Next</tspan>
        <tspan x="168.5" dy="28">Sentence</tspan>
        <tspan x="168.5" dy="28">Prediction</tspan>
      </text>
    </g>

    <!-- Module 2: Repetition (Nested Block) -->
    <g id="block_repetition" data-id="block_repetition" data-class="block" data-parent="block_main_container">
      <rect id="rect_repetition_bg" data-id="rect_repetition_bg" data-class="child_node" data-parent="block_repetition" x="316" y="271" width="149" height="270" rx="25" fill="#A1D4F1" stroke="#2586C4" stroke-width="2"/>
      <text id="text_repetition_title" data-id="text_repetition_title" data-class="child_node" data-parent="block_repetition" x="390.5" y="318" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#000000">Repetition</text>
      
      <!-- Repetition Internal Dashed Sub-container and Spine -->
      <rect id="rect_repetition_inner_dash" data-id="rect_repetition_inner_dash" data-class="child_node" data-parent="block_repetition" x="343" y="350" width="94" height="175" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>
      <path id="edge_repetition_spine" data-id="edge_repetition_spine" data-class="edge" data-source="text_repetition_title" data-target="rect_repetition_inner_dash" d="M 390.5 326 L 390.5 540" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

      <!-- Inner Sub-node: Internal -->
      <g id="node_rep_internal" data-id="node_rep_internal" data-class="child_node" data-parent="block_repetition">
        <rect x="325.5" y="386" width="39" height="116" rx="8" fill="#F2F2F2" stroke="#6F6F6F" stroke-width="1.8"/>
        <text x="-444" y="352" transform="rotate(-90)" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#000000">Internal</text>
      </g>

      <!-- Inner Sub-node: External -->
      <g id="node_rep_external" data-id="node_rep_external" data-class="child_node" data-parent="block_repetition">
        <rect x="371" y="386" width="39" height="116" rx="8" fill="#F2F2F2" stroke="#6F6F6F" stroke-width="1.8"/>
        <text x="-444" y="397.5" transform="rotate(-90)" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#000000">External</text>
      </g>

      <!-- Inner Sub-node: Partner -->
      <g id="node_rep_partner" data-id="node_rep_partner" data-class="child_node" data-parent="block_repetition">
        <rect x="416.5" y="386" width="39" height="116" rx="8" fill="#F2F2F2" stroke="#6F6F6F" stroke-width="1.8"/>
        <text x="-444" y="443" transform="rotate(-90)" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#000000">Partner</text>
      </g>
    </g>

    <!-- Module 3: Question-Asking -->
    <g id="node_question_asking" data-id="node_question_asking" data-class="child_node" data-parent="block_main_container">
      <rect x="537" y="271" width="149" height="270" rx="25" fill="#FDE2C3" stroke="#E5A337" stroke-width="2"/>
      <text x="611.5" y="402" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#000000">
        <tspan x="611.5" dy="0">Question-</tspan>
        <tspan x="611.5" dy="28">Asking</tspan>
      </text>
    </g>

    <!-- Module 4: Short-safe Answers Detection -->
    <g id="node_short_safe" data-id="node_short_safe" data-class="child_node" data-parent="block_main_container">
      <rect x="758" y="271" width="149" height="270" rx="25" fill="#F6C7C7" stroke="#C35656" stroke-width="2"/>
      <text x="832.5" y="388" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#000000">
        <tspan x="832.5" dy="0">Short-safe</tspan>
        <tspan x="832.5" dy="28">Answers</tspan>
        <tspan x="832.5" dy="28">Detection</tspan>
      </text>
    </g>

    <!-- Downward Dashed Edges to Classifier -->
    <path id="edge_next_sentence_to_classifier" data-id="edge_next_sentence_to_classifier" data-class="edge" data-source="node_next_sentence" data-target="node_classifier" d="M 168.5 541 L 168.5 640" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)" fill="none"/>
    <path id="edge_repetition_to_classifier" data-id="edge_repetition_to_classifier" data-class="edge" data-source="block_repetition" data-target="node_classifier" d="M 390.5 541 L 390.5 640" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)" fill="none"/>
    <path id="edge_question_to_classifier" data-id="edge_question_to_classifier" data-class="edge" data-source="node_question_asking" data-target="node_classifier" d="M 611.5 541 L 611.5 640" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)" fill="none"/>
    <path id="edge_short_safe_to_classifier" data-id="edge_short_safe_to_classifier" data-class="edge" data-source="node_short_safe" data-target="node_classifier" d="M 832.5 541 L 832.5 640" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)" fill="none"/>

    <!-- Classifier Node -->
    <g id="node_classifier" data-id="node_classifier" data-class="child_node" data-parent="block_main_container">
      <rect x="94" y="642" width="813" height="56" rx="20" fill="#F4F4F4" stroke="#6F6F6F" stroke-width="2"/>
      <text x="500.5" y="678" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#000000">Classifier</text>
    </g>

    <!-- Dashed Line from Classifier to bottom container border -->
    <path id="edge_classifier_to_boundary" data-id="edge_classifier_to_boundary" data-class="edge" data-source="node_classifier" data-target="rect_main_container" d="M 499 698 L 499 750" stroke="#000000" stroke-width="1.8" stroke-dasharray="4,4" fill="none"/>
  </g>

  <!-- Edge: Container bottom to Response Classification -->
  <path id="edge_container_to_response_class" data-id="edge_container_to_response_class" data-class="edge" data-source="block_main_container" data-target="node_response_classification" d="M 499 750 L 499 808" stroke="#000000" stroke-width="2" marker-end="url(#arrow-solid)"/>

  <!-- Bottom Standalone Node: Response Classification -->
  <g id="node_response_classification" data-id="node_response_classification" data-class="standalone_node" data-parent="root">
    <rect x="334" y="810" width="333" height="76" rx="38" fill="#ADC2D5" stroke="#2B4660" stroke-width="2"/>
    <text x="500.5" y="855" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#000000">Response Classification</text>
  </g>

  <!-- Dynamic Narration Banner -->
  <g id="narration_banner">
    <text id="narr_t1" class="narrative-text" x="500" y="935">
      <tspan x="500" dy="0">The evaluation pipeline begins when the dialogue agent's response is received as input.</tspan>
    </text>
    <text id="narr_t2" class="narrative-text" x="500" y="930">
      <tspan x="500" dy="0">The response data is routed across four parallel attribute evaluation branches</tspan>
      <tspan x="500" dy="22">within the combined module.</tspan>
    </text>
    <text id="narr_t3" class="narrative-text" x="500" y="930">
      <tspan x="500" dy="0">First, the BERT next sentence prediction branch evaluates</tspan>
      <tspan x="500" dy="22">the contextual relevance of the response.</tspan>
    </text>
    <text id="narr_t4" class="narrative-text" x="500" y="930">
      <tspan x="500" dy="0">In parallel, a dedicated repetition control module measures</tspan>
      <tspan x="500" dy="22">n-gram overlap across the dialogue.</tspan>
    </text>
    <text id="narr_t5" class="narrative-text" x="500" y="930">
      <tspan x="500" dy="0">This submodule computes repetition metrics across</tspan>
      <tspan x="500" dy="22">internal, external, and partner-level statements.</tspan>
    </text>
    <text id="narr_t6" class="narrative-text" x="500" y="930">
      <tspan x="500" dy="0">Third, conversational balance is assessed</tspan>
      <tspan x="500" dy="22">by counting the number of questions asked.</tspan>
    </text>
    <text id="narr_t7" class="narrative-text" x="500" y="930">
      <tspan x="500" dy="0">Fourth, the short-safe attribute monitors utterance length</tspan>
      <tspan x="500" dy="22">and the presence of named entities.</tspan>
    </text>
    <text id="narr_t8" class="narrative-text" x="500" y="930">
      <tspan x="500" dy="0">Each attribute outputs a numeric feature value, forwarding</tspan>
      <tspan x="500" dy="22">the combined signals into the classification layer.</tspan>
    </text>
    <text id="narr_t9" class="narrative-text" x="500" y="930">
      <tspan x="500" dy="0">The classifier integrates all extracted attribute scores</tspan>
      <tspan x="500" dy="22">to model conversational judgment.</tspan>
    </text>
    <text id="narr_t10" class="narrative-text" x="500" y="930">
      <tspan x="500" dy="0">Finally, the module outputs the predicted classification score</tspan>
      <tspan x="500" dy="22">for conversational fluidity.</tspan>
    </text>
  </g>
</svg>