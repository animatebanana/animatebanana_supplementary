<svg viewBox="0 0 460 190" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <marker id="ab-arrow-bio" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" style="fill:var(--ink-soft,#7A7160);"/>
    </marker>
  </defs>

  <g data-id="n0" data-order="0" style="--order:0;">
    <rect x="8" y="60" width="76" height="60" rx="10" style="fill:var(--blue,#B7D9E8);stroke:var(--blue-ink,#3E6478);stroke-width:1.5;"/>
    <text x="46" y="86" text-anchor="middle" font-size="8.5" font-family="Inter, sans-serif" fill="#2E2A22">Sequence</text>
    <text x="46" y="98" text-anchor="middle" font-size="8.5" font-family="Inter, sans-serif" fill="#2E2A22">Embedding</text>
  </g>

  <line x1="84" y1="90" x2="94" y2="90" data-order="1" style="--order:1;stroke:var(--ink-soft,#7A7160);stroke-width:1.4;" marker-end="url(#ab-arrow-bio)"/>

  <g data-id="n1" data-order="1" style="--order:1;">
    <rect x="96" y="60" width="84" height="60" rx="10" style="fill:var(--pink,#F2C9D4);stroke:var(--pink-ink,#8C4A5A);stroke-width:1.5;"/>
    <text x="138" y="82" text-anchor="middle" font-size="8" font-family="Inter, sans-serif" fill="#2E2A22">Evolutionary +</text>
    <text x="138" y="94" text-anchor="middle" font-size="8" font-family="Inter, sans-serif" fill="#2E2A22">Structural</text>
    <text x="138" y="106" text-anchor="middle" font-size="8" font-family="Inter, sans-serif" fill="#2E2A22">Features</text>
  </g>

  <line x1="180" y1="90" x2="190" y2="90" data-order="2" style="--order:2;stroke:var(--ink-soft,#7A7160);stroke-width:1.4;" marker-end="url(#ab-arrow-bio)"/>

  <g data-id="n2" data-order="2" style="--order:2;">
    <rect x="192" y="60" width="96" height="60" rx="10" style="fill:var(--mint,#BFE6D3);stroke:var(--mint-ink,#3E7A5C);stroke-width:1.5;"/>
    <text x="240" y="86" text-anchor="middle" font-size="8" font-family="Inter, sans-serif" fill="#2E2A22">Pairwise</text>
    <text x="240" y="98" text-anchor="middle" font-size="8" font-family="Inter, sans-serif" fill="#2E2A22">Representation</text>
  </g>

  <!-- recycling loop: static, shown from the start as part of the source diagram -->
  <path d="M240 60 C 240 20, 288 20, 288 58" fill="none" style="stroke:var(--mint-ink,#3E7A5C);stroke-width:1.3;stroke-dasharray:3,3;" marker-end="url(#ab-arrow-bio)"/>
  <text x="264" y="24" text-anchor="middle" font-size="7.5" font-family="Inter, sans-serif" fill="var(--mint-ink,#3E7A5C)">recycle</text>

  <line x1="288" y1="90" x2="298" y2="90" data-order="3" style="--order:3;stroke:var(--ink-soft,#7A7160);stroke-width:1.4;" marker-end="url(#ab-arrow-bio)"/>

  <g data-id="n3" data-order="3" style="--order:3;">
    <rect x="300" y="60" width="80" height="60" rx="10" style="fill:var(--tan,#E7D9BE);stroke:var(--tan-ink,#7A6636);stroke-width:1.5;"/>
    <text x="340" y="86" text-anchor="middle" font-size="8" font-family="Inter, sans-serif" fill="#2E2A22">Predicted</text>
    <text x="340" y="98" text-anchor="middle" font-size="8" font-family="Inter, sans-serif" fill="#2E2A22">Coordinates</text>
  </g>

  <line x1="380" y1="90" x2="390" y2="90" data-order="4" style="--order:4;stroke:var(--ink-soft,#7A7160);stroke-width:1.4;" marker-end="url(#ab-arrow-bio)"/>

  <g data-id="n4" data-order="4" style="--order:4;">
    <rect x="392" y="60" width="60" height="60" rx="10" style="fill:var(--blue,#B7D9E8);stroke:var(--blue-ink,#3E6478);stroke-width:1.5;"/>
    <text x="422" y="86" text-anchor="middle" font-size="8" font-family="Inter, sans-serif" fill="#2E2A22">Steric</text>
    <text x="422" y="98" text-anchor="middle" font-size="8" font-family="Inter, sans-serif" fill="#2E2A22">Relaxation</text>
  </g>
</svg>
